AWSTemplateFormatVersion: "2010-09-09"
Description: 'ARC Region Switch Plan for Multi-Region Failover'

Parameters:
  Env:
    Type: String
    Default: ''
    Description: String to enable multiple deployments per AWS region
  PrimaryRegion:
    Type: String
    Description: Enter the Primary Region
    Default: "us-east-1"
  StandbyRegion:
    Type: String
    Description: Enter the Standby Region
    Default: "us-west-2"
  DomainName:
    Type: String
    Description: The domain name for the Route53 hosted zone
    Default: "demo.io"
  PrimaryClusterArn:
    Type: String
    Description: ARN of the ECS cluster in the primary region
  StandbyClusterArn:
    Type: String
    Description: ARN of the ECS cluster in the standby region
  PrimaryCatalogDbArn:
    Type: String
    Description: ARN of the Aurora catalog DB cluster in the primary region
  StandbyCatalogDbArn:
    Type: String
    Description: ARN of the Aurora catalog DB cluster in the standby region
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for DNS failover
  AutomaticFailover:
    Type: String
    Default: enabled
    AllowedValues:
      - enabled
      - disabled
    Description: >-
      Whether the plan may start itself. enabled adds the eight alarm triggers (a journey that fails in one Region,
      confirmed from the other, deactivates the failing Region) and lets the plan's execution role start the plan,
      which a trigger needs, because ARC starts a trigger's execution as that role. disabled leaves out both, so only
      an operator can start an execution. The Makefile sets it from AUTOMATIC_FAILOVER.

Conditions:
  AutomaticFailoverEnabled: !Equals [!Ref AutomaticFailover, enabled]

Resources:
  # Where ARC writes the report of each plan execution (the step timeline and the alarm states, against the recovery
  # time objective). Reports are small and expire after 90 days. The bucket mirrors ngrh.yaml's, and
  # destroy-region-switch empties it first: a stack can't delete a bucket that holds reports.
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        LogFilePrefix: access-logs/
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-90-days
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            ExpiredObjectDeleteMarker: true

  ReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ReportsBucket.Arn
              - !Sub '${ReportsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  RegionSwitchExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ARC Region Switch requires broad permissions for cross-service failover orchestration."
    Properties:
      RoleName: !Sub 'RegionSwitchExecutionRole${Env}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: arc-region-switch.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RegionSwitchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "arc-region-switch:GetPlan"
                  - "arc-region-switch:GetPlanExecution"
                  - "arc-region-switch:ListPlanExecutions"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "iam:SimulatePrincipalPolicy"
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/RegionSwitchExecutionRole${Env}'
              - Effect: Allow
                Action:
                  - "cloudwatch:DescribeAlarms"
                  - "cloudwatch:DescribeAlarmHistory"
                  - "cloudwatch:GetMetricStatistics"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "ecs:DescribeServices"
                  - "ecs:UpdateService"
                Resource:
                  - !Sub
                    - 'arn:aws:ecs:${PrimaryRegion}:${AWS::AccountId}:service/${ClusterName}/*'
                    - ClusterName: !Select [1, !Split ["/", !Ref PrimaryClusterArn]]
                  - !Sub
                    - 'arn:aws:ecs:${StandbyRegion}:${AWS::AccountId}:service/${ClusterName}/*'
                    - ClusterName: !Select [1, !Split ["/", !Ref StandbyClusterArn]]
              - Effect: Allow
                Action:
                  - "ecs:DescribeClusters"
                Resource:
                  - !Ref PrimaryClusterArn
                  - !Ref StandbyClusterArn
              - Effect: Allow
                Action:
                  - "ecs:ListServices"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "application-autoscaling:DescribeScalableTargets"
                  - "application-autoscaling:RegisterScalableTarget"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "rds:DescribeGlobalClusters"
                  - "rds:DescribeDBClusters"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "rds:FailoverGlobalCluster"
                  - "rds:SwitchoverGlobalCluster"
                Resource:
                  - !Sub 'arn:aws:rds::${AWS::AccountId}:global-cluster:catalog-global-db-cluster${Env}'
                  - !Ref PrimaryCatalogDbArn
                  - !Ref StandbyCatalogDbArn
              - Effect: Allow
                Action:
                  - "route53:ChangeResourceRecordSets"
                  - "route53:GetHostedZone"
                  - "route53:ListResourceRecordSets"
                Resource:
                  - !Sub
                    - 'arn:aws:route53:::hostedzone/${HostedZoneId}'
                    - HostedZoneId: !Ref HostedZoneId
              - Effect: Allow
                Action:
                  - "route53:GetHealthCheck"
                  - "route53:UpdateHealthCheck"
                Resource: "arn:aws:route53:::healthcheck/*"
              # ARC writes each execution's report with this role.
              - Effect: Allow
                Action: "s3:PutObject"
                Resource: !Sub '${ReportsBucket.Arn}/executions/*'

  # A trigger starts a plan execution as the execution role, so the role needs to be allowed to start the plan it
  # belongs to. The plan needs the role first, so the permission can't sit in the role's own policy: it is a separate
  # policy that names the plan, and only while automatic failover is enabled.
  RegionSwitchSelfStartPolicy:
    Type: AWS::IAM::Policy
    Condition: AutomaticFailoverEnabled
    Properties:
      PolicyName: StartThisPlan
      Roles:
        - !Ref RegionSwitchExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: "arc-region-switch:StartPlanExecution"
            Resource: !Ref RegionSwitchPlan

  RegionSwitchPlan:
    Type: AWS::ARCRegionSwitch::Plan
    Properties:
      # ARC RegionSwitch Plan Name has a 32-char max; the previous
      # 'retail-store-ar-region-switch${Env}' was 29 chars + ENV and
      # overflowed as soon as ENV was more than 3 chars. Shortened to
      # leave ~24 chars of ENV headroom (we use a 7-char sha so current
      # usage is 10 + 8 = 18 chars).
      Name: !Sub 'mr-rs-plan${Env}'
      ExecutionRole: !GetAtt RegionSwitchExecutionRole.Arn
      RecoveryApproach: activeActive
      PrimaryRegion: !Ref PrimaryRegion
      Regions:
        - !Ref PrimaryRegion
        - !Ref StandbyRegion
      # ARC reports each execution against this objective: the time from the start of the execution until the
      # application health alarms below are green.
      RecoveryTimeObjectiveMinutes: 10
      ReportConfiguration:
        ReportOutput:
          # The bucket and prefix ReportsBucket holds; the execution role may write under executions/.
          - S3Configuration:
              BucketOwner: !Ref AWS::AccountId
              BucketPath: !Sub '${ReportsBucket}/executions'
      AssociatedAlarms:
        # Trigger alarms. lcl: a Region's canaries against its own load balancer. rmt: its canaries against the other
        # Region's. region-degraded: any lcl journey of the Region is failing. The key is the alarm's base name and
        # the role of its Region (a map key can't hold the Env or a Region parameter); the ARN holds both.
        journey-lcl-home-primary:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-lcl-home-${PrimaryRegion}${Env}'
        journey-lcl-cart-primary:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-lcl-cart-${PrimaryRegion}${Env}'
        journey-lcl-catalog-primary:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-lcl-catalog-${PrimaryRegion}${Env}'
        journey-lcl-orders-primary:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-lcl-orders-${PrimaryRegion}${Env}'
        journey-rmt-home-primary:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-rmt-home-${PrimaryRegion}${Env}'
        journey-rmt-cart-primary:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-rmt-cart-${PrimaryRegion}${Env}'
        journey-rmt-catalog-primary:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-rmt-catalog-${PrimaryRegion}${Env}'
        journey-rmt-orders-primary:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-rmt-orders-${PrimaryRegion}${Env}'
        region-degraded-primary:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:region-degraded-${PrimaryRegion}${Env}'
        journey-lcl-home-standby:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-lcl-home-${StandbyRegion}${Env}'
        journey-lcl-cart-standby:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-lcl-cart-${StandbyRegion}${Env}'
        journey-lcl-catalog-standby:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-lcl-catalog-${StandbyRegion}${Env}'
        journey-lcl-orders-standby:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-lcl-orders-${StandbyRegion}${Env}'
        journey-rmt-home-standby:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-rmt-home-${StandbyRegion}${Env}'
        journey-rmt-cart-standby:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-rmt-cart-${StandbyRegion}${Env}'
        journey-rmt-catalog-standby:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-rmt-catalog-${StandbyRegion}${Env}'
        journey-rmt-orders-standby:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-rmt-orders-${StandbyRegion}${Env}'
        region-degraded-standby:
          AlarmType: trigger
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:region-degraded-${StandbyRegion}${Env}'
        # Application health alarms: the global canaries. They reach the application by its Route 53 name, so they
        # go green only once traffic has moved. ARC reads them after an execution to measure the recovery time.
        journey-global-home-primary:
          AlarmType: applicationHealth
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-global-home-${PrimaryRegion}${Env}'
        journey-global-cart-primary:
          AlarmType: applicationHealth
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-global-cart-${PrimaryRegion}${Env}'
        journey-global-catalog-primary:
          AlarmType: applicationHealth
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-global-catalog-${PrimaryRegion}${Env}'
        journey-global-orders-primary:
          AlarmType: applicationHealth
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${PrimaryRegion}:${AWS::AccountId}:alarm:journey-global-orders-${PrimaryRegion}${Env}'
        journey-global-home-standby:
          AlarmType: applicationHealth
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-global-home-${StandbyRegion}${Env}'
        journey-global-cart-standby:
          AlarmType: applicationHealth
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-global-cart-${StandbyRegion}${Env}'
        journey-global-catalog-standby:
          AlarmType: applicationHealth
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-global-catalog-${StandbyRegion}${Env}'
        journey-global-orders-standby:
          AlarmType: applicationHealth
          ResourceIdentifier: !Sub 'arn:${AWS::Partition}:cloudwatch:${StandbyRegion}:${AWS::AccountId}:alarm:journey-global-orders-${StandbyRegion}${Env}'
      # Triggers (design 5.6), present only while AutomaticFailover is enabled. One for each Region A, its peer B and
      # journey J: deactivate A when J fails in A (journey-lcl-J in A is red), B confirms it (journey-rmt-J in B, B's view
      # of A, is red), and B is healthy itself (region-degraded in B is green). A both-Regions event meets none of them,
      # because B must be green, and neither does one broken observer, because B must agree. ARC starts the execution
      # graceful, as the plan's execution role (RegionSwitchSelfStartPolicy), and not more than once an hour for a
      # trigger. The names in the conditions are the keys of AssociatedAlarms above.
      Triggers: !If
        - AutomaticFailoverEnabled
        - - Action: deactivate
            TargetRegion: !Ref PrimaryRegion
            MinDelayMinutesBetweenExecutions: 60
            Description: !Sub 'Deactivate ${PrimaryRegion}: its home journey fails there, and ${StandbyRegion} sees it fail too while ${StandbyRegion} is healthy'
            Conditions:
              - AssociatedAlarmName: journey-lcl-home-primary
                Condition: red
              - AssociatedAlarmName: journey-rmt-home-standby
                Condition: red
              - AssociatedAlarmName: region-degraded-standby
                Condition: green
          - Action: deactivate
            TargetRegion: !Ref PrimaryRegion
            MinDelayMinutesBetweenExecutions: 60
            Description: !Sub 'Deactivate ${PrimaryRegion}: its cart journey fails there, and ${StandbyRegion} sees it fail too while ${StandbyRegion} is healthy'
            Conditions:
              - AssociatedAlarmName: journey-lcl-cart-primary
                Condition: red
              - AssociatedAlarmName: journey-rmt-cart-standby
                Condition: red
              - AssociatedAlarmName: region-degraded-standby
                Condition: green
          - Action: deactivate
            TargetRegion: !Ref PrimaryRegion
            MinDelayMinutesBetweenExecutions: 60
            Description: !Sub 'Deactivate ${PrimaryRegion}: its catalog journey fails there, and ${StandbyRegion} sees it fail too while ${StandbyRegion} is healthy'
            Conditions:
              - AssociatedAlarmName: journey-lcl-catalog-primary
                Condition: red
              - AssociatedAlarmName: journey-rmt-catalog-standby
                Condition: red
              - AssociatedAlarmName: region-degraded-standby
                Condition: green
          - Action: deactivate
            TargetRegion: !Ref PrimaryRegion
            MinDelayMinutesBetweenExecutions: 60
            Description: !Sub 'Deactivate ${PrimaryRegion}: its orders journey fails there, and ${StandbyRegion} sees it fail too while ${StandbyRegion} is healthy'
            Conditions:
              - AssociatedAlarmName: journey-lcl-orders-primary
                Condition: red
              - AssociatedAlarmName: journey-rmt-orders-standby
                Condition: red
              - AssociatedAlarmName: region-degraded-standby
                Condition: green
          - Action: deactivate
            TargetRegion: !Ref StandbyRegion
            MinDelayMinutesBetweenExecutions: 60
            Description: !Sub 'Deactivate ${StandbyRegion}: its home journey fails there, and ${PrimaryRegion} sees it fail too while ${PrimaryRegion} is healthy'
            Conditions:
              - AssociatedAlarmName: journey-lcl-home-standby
                Condition: red
              - AssociatedAlarmName: journey-rmt-home-primary
                Condition: red
              - AssociatedAlarmName: region-degraded-primary
                Condition: green
          - Action: deactivate
            TargetRegion: !Ref StandbyRegion
            MinDelayMinutesBetweenExecutions: 60
            Description: !Sub 'Deactivate ${StandbyRegion}: its cart journey fails there, and ${PrimaryRegion} sees it fail too while ${PrimaryRegion} is healthy'
            Conditions:
              - AssociatedAlarmName: journey-lcl-cart-standby
                Condition: red
              - AssociatedAlarmName: journey-rmt-cart-primary
                Condition: red
              - AssociatedAlarmName: region-degraded-primary
                Condition: green
          - Action: deactivate
            TargetRegion: !Ref StandbyRegion
            MinDelayMinutesBetweenExecutions: 60
            Description: !Sub 'Deactivate ${StandbyRegion}: its catalog journey fails there, and ${PrimaryRegion} sees it fail too while ${PrimaryRegion} is healthy'
            Conditions:
              - AssociatedAlarmName: journey-lcl-catalog-standby
                Condition: red
              - AssociatedAlarmName: journey-rmt-catalog-primary
                Condition: red
              - AssociatedAlarmName: region-degraded-primary
                Condition: green
          - Action: deactivate
            TargetRegion: !Ref StandbyRegion
            MinDelayMinutesBetweenExecutions: 60
            Description: !Sub 'Deactivate ${StandbyRegion}: its orders journey fails there, and ${PrimaryRegion} sees it fail too while ${PrimaryRegion} is healthy'
            Conditions:
              - AssociatedAlarmName: journey-lcl-orders-standby
                Condition: red
              - AssociatedAlarmName: journey-rmt-orders-primary
                Condition: red
              - AssociatedAlarmName: region-degraded-primary
                Condition: green
        - !Ref AWS::NoValue
      Workflows:
        - WorkflowTargetAction: deactivate
          WorkflowDescription: "Scale up the remaining region, shift DNS away, then switch the catalog database over"
          Steps:
            - Name: scale-up-ecs-services
              ExecutionBlockType: Parallel
              ExecutionBlockConfiguration:
                ParallelConfig:
                  Steps:
                    - Name: scale-carts
                      ExecutionBlockType: ECSServiceScaling
                      ExecutionBlockConfiguration:
                        EcsCapacityIncreaseConfig:
                          Services:
                            - ClusterArn: !Ref PrimaryClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${PrimaryRegion}:${AWS::AccountId}:service/${ClusterName}/carts${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref PrimaryClusterArn]]
                            - ClusterArn: !Ref StandbyClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${StandbyRegion}:${AWS::AccountId}:service/${ClusterName}/carts${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref StandbyClusterArn]]
                          TargetPercent: 200
                          CapacityMonitoringApproach: containerInsightsMaxInLast24Hours
                          TimeoutMinutes: 15
                    - Name: scale-orders
                      ExecutionBlockType: ECSServiceScaling
                      ExecutionBlockConfiguration:
                        EcsCapacityIncreaseConfig:
                          Services:
                            - ClusterArn: !Ref PrimaryClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${PrimaryRegion}:${AWS::AccountId}:service/${ClusterName}/orders${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref PrimaryClusterArn]]
                            - ClusterArn: !Ref StandbyClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${StandbyRegion}:${AWS::AccountId}:service/${ClusterName}/orders${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref StandbyClusterArn]]
                          TargetPercent: 200
                          CapacityMonitoringApproach: containerInsightsMaxInLast24Hours
                          TimeoutMinutes: 15
                    - Name: scale-assets
                      ExecutionBlockType: ECSServiceScaling
                      ExecutionBlockConfiguration:
                        EcsCapacityIncreaseConfig:
                          Services:
                            - ClusterArn: !Ref PrimaryClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${PrimaryRegion}:${AWS::AccountId}:service/${ClusterName}/assets${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref PrimaryClusterArn]]
                            - ClusterArn: !Ref StandbyClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${StandbyRegion}:${AWS::AccountId}:service/${ClusterName}/assets${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref StandbyClusterArn]]
                          TargetPercent: 200
                          CapacityMonitoringApproach: containerInsightsMaxInLast24Hours
                          TimeoutMinutes: 15
                    - Name: scale-catalog
                      ExecutionBlockType: ECSServiceScaling
                      ExecutionBlockConfiguration:
                        EcsCapacityIncreaseConfig:
                          Services:
                            - ClusterArn: !Ref PrimaryClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${PrimaryRegion}:${AWS::AccountId}:service/${ClusterName}/catalog${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref PrimaryClusterArn]]
                            - ClusterArn: !Ref StandbyClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${StandbyRegion}:${AWS::AccountId}:service/${ClusterName}/catalog${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref StandbyClusterArn]]
                          TargetPercent: 200
                          CapacityMonitoringApproach: containerInsightsMaxInLast24Hours
                          TimeoutMinutes: 15
                    - Name: scale-checkout
                      ExecutionBlockType: ECSServiceScaling
                      ExecutionBlockConfiguration:
                        EcsCapacityIncreaseConfig:
                          Services:
                            - ClusterArn: !Ref PrimaryClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${PrimaryRegion}:${AWS::AccountId}:service/${ClusterName}/checkout${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref PrimaryClusterArn]]
                            - ClusterArn: !Ref StandbyClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${StandbyRegion}:${AWS::AccountId}:service/${ClusterName}/checkout${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref StandbyClusterArn]]
                          TargetPercent: 200
                          CapacityMonitoringApproach: containerInsightsMaxInLast24Hours
                          TimeoutMinutes: 15
                    - Name: scale-ui
                      ExecutionBlockType: ECSServiceScaling
                      ExecutionBlockConfiguration:
                        EcsCapacityIncreaseConfig:
                          Services:
                            - ClusterArn: !Ref PrimaryClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${PrimaryRegion}:${AWS::AccountId}:service/${ClusterName}/ui${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref PrimaryClusterArn]]
                            - ClusterArn: !Ref StandbyClusterArn
                              ServiceArn:
                                !Sub
                                  - 'arn:aws:ecs:${StandbyRegion}:${AWS::AccountId}:service/${ClusterName}/ui${Env}'
                                  - ClusterName: !Select [1, !Split ["/", !Ref StandbyClusterArn]]
                          TargetPercent: 200
                          CapacityMonitoringApproach: containerInsightsMaxInLast24Hours
                          TimeoutMinutes: 15
            - Name: shift-dns-traffic-away
              ExecutionBlockType: Route53HealthCheck
              ExecutionBlockConfiguration:
                Route53HealthCheckConfig:
                  HostedZoneId: !Ref HostedZoneId
                  RecordName: !Sub 'store.${DomainName}'
                  RecordSets:
                    - RecordSetIdentifier: PrimaryRegion
                      Region: !Ref PrimaryRegion
                    - RecordSetIdentifier: StandbyRegion
                      Region: !Ref StandbyRegion
                  TimeoutMinutes: 5
            # Last, after traffic has moved. The switchover loses no data. If it can't finish, for example because the
            # primary database is down, the run pauses with traffic already moved, and a person decides whether to
            # retry it, skip it, or switch the run to ungraceful, which fails the database over and can lose data.
            # Ungraceful applies only if a person makes that choice: Behavior stays switchoverOnly.
            - Name: switch-over-catalog-db
              ExecutionBlockType: AuroraGlobalDatabase
              ExecutionBlockConfiguration:
                GlobalAuroraConfig:
                  GlobalClusterIdentifier: !Sub 'catalog-global-db-cluster${Env}'
                  DatabaseClusterArns:
                    - !Ref PrimaryCatalogDbArn
                    - !Ref StandbyCatalogDbArn
                  Behavior: switchoverOnly
                  Ungraceful:
                    Ungraceful: failover
                  TimeoutMinutes: 10
        - WorkflowTargetAction: activate
          WorkflowDescription: "Re-enable region in DNS"
          Steps:
            - Name: restore-dns-traffic
              ExecutionBlockType: Route53HealthCheck
              ExecutionBlockConfiguration:
                Route53HealthCheckConfig:
                  HostedZoneId: !Ref HostedZoneId
                  RecordName: !Sub 'store.${DomainName}'
                  RecordSets:
                    - RecordSetIdentifier: PrimaryRegion
                      Region: !Ref PrimaryRegion
                    - RecordSetIdentifier: StandbyRegion
                      Region: !Ref StandbyRegion
                  TimeoutMinutes: 5

Outputs:
  RegionSwitchPlanArn:
    Description: ARN of the ARC Region Switch Plan
    Value: !Ref RegionSwitchPlan
  RegionSwitchExecutionRoleArn:
    Description: ARN of the Region Switch Execution Role
    Value: !GetAtt RegionSwitchExecutionRole.Arn
  ReportsBucketName:
    Description: Bucket that holds the plan's execution reports under executions/ (destroy-region-switch empties it)
    Value: !Ref ReportsBucket
