version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR in $PRIMARY_REGION...
      - aws ecr get-login-password --region $PRIMARY_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$PRIMARY_REGION.amazonaws.com
      - |
        if [ "$PRIMARY_ONLY" != "true" ]; then
          echo Logging in to Amazon ECR in $STANDBY_REGION...
          aws ecr get-login-password --region $STANDBY_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$STANDBY_REGION.amazonaws.com
        fi
  build:
    commands:
      - |
        for ENTRY in \
          "cloudwatch-agent${ENV_SUFFIX}:public.ecr.aws/cloudwatch-agent/cloudwatch-agent:latest" \
          "adot-autoinstrumentation-java${ENV_SUFFIX}:public.ecr.aws/aws-observability/adot-autoinstrumentation-java:v2.29.0" \
          "adot-autoinstrumentation-node${ENV_SUFFIX}:public.ecr.aws/aws-observability/adot-autoinstrumentation-node:v0.12.0"; do
          REPO=${ENTRY%%:*}; SRC=${ENTRY#*:}; TAG_VAL=${SRC##*:}
          echo "Pulling $SRC..."
          docker pull $SRC
          echo "Pushing to $AWS_ACCOUNT_ID.dkr.ecr.$PRIMARY_REGION.amazonaws.com/$REPO:$TAG_VAL..."
          docker tag $SRC $AWS_ACCOUNT_ID.dkr.ecr.$PRIMARY_REGION.amazonaws.com/$REPO:$TAG_VAL
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$PRIMARY_REGION.amazonaws.com/$REPO:$TAG_VAL
          if [ "$PRIMARY_ONLY" != "true" ]; then
            echo "Pushing to $AWS_ACCOUNT_ID.dkr.ecr.$STANDBY_REGION.amazonaws.com/$REPO:$TAG_VAL..."
            docker tag $SRC $AWS_ACCOUNT_ID.dkr.ecr.$STANDBY_REGION.amazonaws.com/$REPO:$TAG_VAL
            docker push $AWS_ACCOUNT_ID.dkr.ecr.$STANDBY_REGION.amazonaws.com/$REPO:$TAG_VAL
          fi
        done
      - |
        # FIS fault-injection sidecar (every task definition in ecs.yaml). The
        # task subnets have no internet route, so everything the sidecar and
        # the FIS fault documents run inside a task is baked into this image.
        # The Dockerfile below is deployment/ssm-agent-sidecar.Dockerfile, which
        # says what is baked in and why; this build has no source, so its lines
        # are written here, and tests/test_fis_sidecar.py holds the two equal.
        # The weekly repave (self-update.yaml) rebuilds the image from that file
        # and leaves the FROM line alone when it mirrors the images named here.
        set -e
        REPO=amazon-ssm-agent${ENV_SUFFIX}
        {
          echo "FROM public.ecr.aws/amazon-ssm-agent/amazon-ssm-agent:latest"
          echo "RUN dnf upgrade -y && dnf install -y jq procps awscli curl-minimal util-linux && dnf clean all"
          echo "RUN dnf install -y at bind-utils lsof iproute iproute-tc && dnf clean all"
          echo "RUN dnf install -y python3 python3-requests && dnf clean all"
        } > Dockerfile.ssm-agent
        docker build -t $REPO:latest -f Dockerfile.ssm-agent .
        REGIONS=$PRIMARY_REGION
        if [ "$PRIMARY_ONLY" != "true" ]; then REGIONS="$REGIONS $STANDBY_REGION"; fi
        for R in $REGIONS; do
          echo "Pushing $REPO:latest to $R..."
          docker tag $REPO:latest $AWS_ACCOUNT_ID.dkr.ecr.$R.amazonaws.com/$REPO:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$R.amazonaws.com/$REPO:latest
        done
      - echo "Sidecar image mirroring completed successfully"
