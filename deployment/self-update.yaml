AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Self-update automation for long-lived installs. Weekly EventBridge Scheduler
  triggers a CodeBuild repave: clone main, rebuild all service images (fresh
  base layers + current dependencies), re-mirror observability sidecars, then
  roll out - a CloudFormation Tag update when the commit changed, or a forced
  ECS deployment when only base layers moved. Combined with the ECR lifecycle
  policies, superseded vulnerable images are expired and their Inspector
  findings auto-close without operator intervention.

Parameters:
  Env:
    Type: String
    Default: ''
    Description: String to enable multiple deployments per AWS region
  PrimaryRegion:
    Type: String
    Default: 'us-east-1'
  StandbyRegion:
    Type: String
    Default: 'us-west-2'
  GitRepoUrl:
    Type: String
    Default: 'https://github.com/aws-samples/sample-multi-region-resilient-microservice-on-aws'
    Description: Public repository cloned for each repave (branch main)
  ScheduleExpression:
    Type: String
    Default: 'cron(0 6 ? * SUN *)'
    Description: Weekly repave schedule (UTC)

Resources:
  SelfUpdateRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ecs:RegisterTaskDefinition/DeregisterTaskDefinition and List* do not support resource-level permissions and require Resource '*'. All scopable write actions (UpdateService, UpdateStack, ECR push) are constrained to apps/self-update resources."
    Properties:
      RoleName: !Sub 'mr-app-self-update-role${Env}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EcrPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                Resource:
                  - !Sub 'arn:aws:ecr:${PrimaryRegion}:${AWS::AccountId}:repository/*${Env}'
                  - !Sub 'arn:aws:ecr:${StandbyRegion}:${AWS::AccountId}:repository/*${Env}'
        - PolicyName: Rollout
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:UpdateStack
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub 'arn:aws:cloudformation:${PrimaryRegion}:${AWS::AccountId}:stack/apps${Env}/*'
                  - !Sub 'arn:aws:cloudformation:${StandbyRegion}:${AWS::AccountId}:stack/apps${Env}/*'
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource:
                  - !Sub 'arn:aws:ecs:${PrimaryRegion}:${AWS::AccountId}:service/apps${Env}-*/*'
                  - !Sub 'arn:aws:ecs:${StandbyRegion}:${AWS::AccountId}:service/apps${Env}-*/*'
              # CloudFormation resolves !GetAtt EcsCluster.Arn on the scalable
              # targets with the CALLER's permissions (observed 2026-08-17:
              # ecs:DescribeClusters denial rolled back the apps update after
              # the service updates had already succeeded).
              - Effect: Allow
                Action: ecs:DescribeClusters
                Resource:
                  - !Sub 'arn:aws:ecs:${PrimaryRegion}:${AWS::AccountId}:cluster/apps${Env}-*'
                  - !Sub 'arn:aws:ecs:${StandbyRegion}:${AWS::AccountId}:cluster/apps${Env}-*'
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:ListServices
                  - ecs:ListClusters
                # These ECS actions do not support resource-level permissions
                # and require Resource '*' (see checkov skip CKV_AWS_111 above).
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/*${Env}*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  # GetParameters (plural) is the batch API CloudFormation calls
                  # when resolving SSM-typed template parameters during UpdateStack.
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/*'
              # The apps stack update creates new task-definition revisions and
              # updates services; CloudFormation resolves the template's secret
              # dynamic references and Fn::GetAtt on security groups / load
              # balancers with the CALLER's permissions (observed 2026-08-17:
              # secretsmanager:GetSecretValue on cartsTable-devSecret and
              # ec2:Describe* denials rolled back the update).
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:*:${AWS::AccountId}:secret:*${Env}*'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringLike:
                    kms:ViaService: secretsmanager.*.amazonaws.com
              # CloudFormation re-fetches resource attributes (observed with
              # ecs:DescribeClusters for !GetAtt EcsCluster.Arn) using the
              # CALLER's permissions during update; kms:DescribeKey covers
              # !GetAtt LogGroupKey.Arn the same way. Read-only.
              - Effect: Allow
                Action: kms:DescribeKey
                Resource: !Sub 'arn:aws:kms:*:${AWS::AccountId}:key/*'
              - Effect: Allow
                Action:
                  - ec2:Describe*
                  - elasticloadbalancing:Describe*
                  # CFN resolves the checkout ElastiCache (Redis) attributes
                  # during service updates via elasticache:DescribeReplicationGroups
                  # with the CALLER's credentials. A denial here is retried by the
                  # CFN handler for 30-40 min and then misreported as a stack-level
                  # "Internal Failure" with no resource event and no surfaced
                  # AccessDenied (observed live 2026-08-17 in both regions).
                  - elasticache:Describe*
                  # The same CFN read handler also calls ListTagsForResource to
                  # build the resource model; a denial there fails the GetAtt with
                  # a misleading "Attribute 'PrimaryEndPoint.Port' does not exist"
                  # (observed live 2026-08-17, us-west-2).
                  - elasticache:ListTagsForResource
                # Read-only attribute resolution; these Describe actions do not
                # support resource-level permissions.
                Resource: '*'
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/mr-app-self-update${Env}*'
        - PolicyName: Kms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Sub 'arn:aws:kms:*:${AWS::AccountId}:key/*'

  SelfUpdateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub 'mr-app-self-update${Env}'
      Description: Weekly repave - rebuild images from main and roll out
      ServiceRole: !GetAtt SelfUpdateRole.Arn
      TimeoutInMinutes: 60
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENV_SUFFIX
            Value: !Ref Env
          - Name: PRIMARY_REGION
            Value: !Ref PrimaryRegion
          - Name: STANDBY_REGION
            Value: !Ref StandbyRegion
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
      Source:
        Type: GITHUB
        Location: !Ref GitRepoUrl
        GitCloneDepth: 1
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - TAG=$(git rev-parse --short=7 HEAD)
                - echo "Repave from main @ $TAG"
                - for R in $PRIMARY_REGION $STANDBY_REGION; do aws ecr get-login-password --region $R | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$R.amazonaws.com; done
            build:
              commands:
                # 1. Rebuild every service image from current main (fresh base layers)
                - |
                  for ENTRY in catalog:catalog checkout:checkout ui:ui carts:cart assets:assets orders:orders; do
                    SVC=${ENTRY%%:*}; SRC=${ENTRY##*:}
                    echo "Building $SVC from source/$SRC..."
                    docker build --pull -t $SVC:$TAG source/$SRC
                    for R in $PRIMARY_REGION $STANDBY_REGION; do
                      docker tag $SVC:$TAG $AWS_ACCOUNT_ID.dkr.ecr.$R.amazonaws.com/${SVC}${ENV_SUFFIX}:$TAG
                      docker push $AWS_ACCOUNT_ID.dkr.ecr.$R.amazonaws.com/${SVC}${ENV_SUFFIX}:$TAG
                    done
                  done
                # 2. Re-mirror observability sidecars at the pinned versions
                - |
                  for ENTRY in $(grep -oE 'public\.ecr\.aws/[a-z-]+/[a-z-]+:[a-zA-Z0-9.]+' deployment/mirror-sidecar-buildspec.yml | sort -u); do
                    NAME=$(basename ${ENTRY%%:*}); TAG_VAL=${ENTRY##*:}
                    docker pull $ENTRY
                    for R in $PRIMARY_REGION $STANDBY_REGION; do
                      docker tag $ENTRY $AWS_ACCOUNT_ID.dkr.ecr.$R.amazonaws.com/${NAME}${ENV_SUFFIX}:$TAG_VAL
                      docker push $AWS_ACCOUNT_ID.dkr.ecr.$R.amazonaws.com/${NAME}${ENV_SUFFIX}:$TAG_VAL
                    done
                  done
            post_build:
              commands:
                # 3. Roll out: CFN Tag update when commit changed, forced ECS deployment otherwise.
                # set -e: any rollout failure MUST fail the build -- without it a denied
                # UpdateStack is swallowed by the loop and CodeBuild reports SUCCEEDED
                # while services keep running the old images (observed 2026-08-16).
                - |
                  set -e
                  for R in $PRIMARY_REGION $STANDBY_REGION; do
                    CURRENT=$(aws cloudformation describe-stacks --region $R --stack-name apps${ENV_SUFFIX} --query "Stacks[0].Parameters[?ParameterKey=='Tag'].ParameterValue" --output text)
                    if [ "$CURRENT" != "$TAG" ]; then
                      echo "$R: updating apps${ENV_SUFFIX} Tag $CURRENT -> $TAG"
                      aws cloudformation update-stack --region $R --stack-name apps${ENV_SUFFIX} \
                        --use-previous-template \
                        --parameters ParameterKey=Tag,ParameterValue=$TAG \
                          ParameterKey=Env,UsePreviousValue=true \
                          ParameterKey=PrimaryRegion,UsePreviousValue=true \
                          ParameterKey=StandbyRegion,UsePreviousValue=true \
                          ParameterKey=KmsKey,UsePreviousValue=true \
                        --capabilities CAPABILITY_NAMED_IAM
                      aws cloudformation wait stack-update-complete --region $R --stack-name apps${ENV_SUFFIX}
                    else
                      echo "$R: same commit - forcing new deployment to pick up rebuilt layers"
                      CL=$(aws ecs list-clusters --region $R --query 'clusterArns[0]' --output text)
                      for S in $(aws ecs list-services --region $R --cluster $CL --query 'serviceArns[]' --output text); do
                        aws ecs update-service --region $R --cluster $CL --service $S --force-new-deployment --query 'service.serviceName' --output text
                      done
                    fi
                  done
                - echo "Repave complete - ECR lifecycle policies will expire superseded images and Inspector findings will auto-close"

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt SelfUpdateProject.Arn

  WeeklyRepaveSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'mr-app-weekly-repave${Env}'
      Description: Weekly image repave so CVE findings self-remediate
      ScheduleExpression: !Ref ScheduleExpression
      FlexibleTimeWindow:
        Mode: FLEXIBLE
        MaximumWindowInMinutes: 60
      Target:
        Arn: !GetAtt SelfUpdateProject.Arn
        RoleArn: !GetAtt ScheduleRole.Arn

Outputs:
  SelfUpdateProjectName:
    Value: !Ref SelfUpdateProject
