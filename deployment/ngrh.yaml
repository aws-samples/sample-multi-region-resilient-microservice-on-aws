AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Next-Gen Resilience Hub (ResilienceHubV2) model for the multi-region resilient
  microservice. Defines two resiliency policies (Tier-1 / Tier-2), one System,
  four User Journeys, and six Services. Each Service discovers its resources by
  TAG (input source `service` in {<service-name>, shared}) rather than by
  CloudFormation stack, so a service only sees the resources it actually uses
  plus shared infrastructure. DependencyDiscovery stays ENABLED so each service
  is registered as a traffic source and its dependency graph is expanded from the
  tagged seed. Assessment execution is imperative (see `make ngrh-assess`).

# ---------------------------------------------------------------------------
# Parameters. Resource discovery is tag-based (key "service"), so no per-stack
# ARNs are required, so this template is portable across any account/Env.
# ---------------------------------------------------------------------------
Parameters:
  Env:
    Type: String
    Default: ""
    Description: Environment suffix (e.g. -ngrh). Must match the app deploy ENV.
  PrimaryRegion:
    Type: String
    Default: us-east-1
  StandbyRegion:
    Type: String
    Default: us-west-2

Resources:

  # -------------------------------------------------------------------------
  # Shared NGRH bucket — reports go under /reports/, design files under
  # /design-files/. Name is CFN-generated (random suffix) to avoid collisions.
  # -------------------------------------------------------------------------
  NgrhBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        LogFilePrefix: access-logs/
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports-90d
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            ExpiredObjectDeleteMarker: true

  # -------------------------------------------------------------------------
  # Invoker role NGRH assumes to discover resources, run assessments and run
  # tests. The V2 assessment policy covers discovery and assessment reads.
  # The resilience testing policy lets NGRH create, start, stop and read the
  # FIS experiment behind each test run (tagged managedBy=resiliencehub),
  # pass the test's experiment role to FIS, and read CloudWatch alarm history
  # for the test's alarms. Without it every test run fails at
  # fis:CreateExperimentTemplate.
  # -------------------------------------------------------------------------
  InvokerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ngrh-invoker${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: resiliencehub.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSResilienceHubV2AssessmentExecutionPolicy
        - arn:aws:iam::aws:policy/AWSResilienceHubResilienceTestingPolicy
      Policies:
        # S3 write access for NGRH report output and design file reads.
        # All other read permissions (CFN, ARC, EC2, ECS, etc.) are covered
        # by the V2 managed assessment execution policy above.
        - PolicyName: ngrh-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt NgrhBucket.Arn
                  - !Sub "${NgrhBucket.Arn}/*"

  # -------------------------------------------------------------------------
  # Experiment role for NGRH tests: choose it as the IAM role when creating a
  # test. NGRH builds an FIS experiment from the test template and FIS
  # assumes this role to inject the faults, so it carries the permissions
  # the FIS actions reference lists for every action in the four NGRH test
  # templates (AZ recovery, dependency validation, multi-Region isolation,
  # multi-Region recovery). The four network actions use the AWS managed
  # FIS network policy; the rest are below. SSM commands are limited to the
  # FIS-provided AWSFIS-* documents. Faults on ECS tasks additionally need
  # the FIS SSM agent sidecar and enableFaultInjection in the task definition.
  # -------------------------------------------------------------------------
  TestExperimentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ngrh-test-experiment${Env}"
      Description: FIS experiment role for Resilience Hub (NGRH) tests
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: fis.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:fis:*:${AWS::AccountId}:experiment/*"
      ManagedPolicyArns:
        # aws:network:disrupt-connectivity, route-table- and transit-gateway-
        # disrupt-cross-region-connectivity; tag-scoped to managedByFIS.
        - arn:aws:iam::aws:policy/service-role/AWSFaultInjectionSimulatorNetworkAccess
      Policies:
        - PolicyName: ngrh-test-faults
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # aws:ec2:stop-instances (AZ recovery)
              - Sid: Ec2StopStartInstances
                Effect: Allow
                Action:
                  - ec2:StopInstances
                  - ec2:StartInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*"
              # Restart instances that have encrypted EBS volumes.
              - Sid: Ec2EncryptedVolumeGrant
                Effect: Allow
                Action: kms:CreateGrant
                Resource: !Sub "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
                Condition:
                  StringLike:
                    kms:ViaService: ec2.*.amazonaws.com
                  Bool:
                    kms:GrantIsForAWSResource: "true"
              # aws:ec2:api-/asg-insufficient-instance-capacity-error (AZ recovery).
              # InjectApiError has no resource type, so it is scoped by action id.
              - Sid: Ec2CapacityErrors
                Effect: Allow
                Action: ec2:InjectApiError
                Resource: "*"
                Condition:
                  ForAnyValue:StringEquals:
                    ec2:FisActionId:
                      - aws:ec2:api-insufficient-instance-capacity-error
                      - aws:ec2:asg-insufficient-instance-capacity-error
              # aws:elasticache:replicationgroup-interrupt-az-power (AZ recovery)
              - Sid: ElastiCacheAzPower
                Effect: Allow
                Action:
                  - elasticache:InterruptClusterAzPower
                  - elasticache:DescribeReplicationGroups
                Resource: !Sub "arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:replicationgroup:*"
              # aws:rds:failover-db-cluster (AZ recovery)
              - Sid: RdsFailoverCluster
                Effect: Allow
                Action:
                  - rds:FailoverDBCluster
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster:*"
                  - !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:db:*"
              # aws:arc:start-zonal-autoshift (AZ recovery). Load balancers are
              # resources; Auto Scaling groups and EKS clusters are matched by
              # the zonal shift resource identifier.
              - Sid: ZonalShiftLoadBalancers
                Effect: Allow
                Action:
                  - arc-zonal-shift:StartZonalShift
                  - arc-zonal-shift:GetManagedResource
                  - arc-zonal-shift:UpdateZonalShift
                  - arc-zonal-shift:CancelZonalShift
                Resource:
                  - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:loadbalancer/app/*"
                  - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:${AWS::AccountId}:loadbalancer/net/*"
              - Sid: ZonalShiftAsgAndEks
                Effect: Allow
                Action:
                  - arc-zonal-shift:StartZonalShift
                  - arc-zonal-shift:GetManagedResource
                  - arc-zonal-shift:UpdateZonalShift
                  - arc-zonal-shift:CancelZonalShift
                Resource: "*"
                Condition:
                  StringLike:
                    arc-zonal-shift:ResourceIdentifier:
                      - !Sub "arn:${AWS::Partition}:autoscaling:*:${AWS::AccountId}:autoScalingGroup:*"
                      - !Sub "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/*"
              # aws:ssm:send-command on EC2 instances, and the SSM commands FIS
              # runs on ECS tasks registered by the FIS sidecar
              # (aws:ecs:task-network-packet-loss). Only FIS-provided documents.
              - Sid: SsmRunFisDocuments
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:*:*:document/AWSFIS-*"
                  - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:managed-instance/*"
              # ssm:CancelCommand has no resource type; FIS uses it to stop its
              # own commands when an action ends or is stopped.
              - Sid: SsmCancelCommands
                Effect: Allow
                Action: ssm:CancelCommand
                Resource: "*"
              # aws:ecs:task-network-packet-loss target lookup
              - Sid: EcsTaskTargets
                Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:DescribeContainerInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:task/*/*"
                  - !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:container-instance/*/*"
              # aws:eks:pod-network-packet-loss target lookup. The role also
              # needs an EKS access entry in each cluster it targets.
              - Sid: EksPodTargets
                Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub "arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/*"
              # aws:network:disrupt-vpc-endpoint (multi-Region isolation): FIS
              # swaps the endpoint's security groups for an empty one it creates.
              - Sid: VpcEndpointIsolation
                Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:ModifyVpcEndpoint
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*"
                  - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*"
                  - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-endpoint/*"
              - Sid: VpcEndpointIsolationTags
                Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: CreateSecurityGroup
              - Sid: VpcEndpointCrossRegion
                Effect: Allow
                Action: vpce:AllowMultiRegion
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc-endpoint/*"
              # aws:s3:bucket-pause-replication (multi-Region isolation), limited
              # to this account's buckets. Condition form follows the FIS
              # example policy for this action.
              - Sid: S3PauseReplication
                Effect: Allow
                Action: s3:PauseReplication
                Resource: !Sub "arn:${AWS::Partition}:s3:::*"
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref "AWS::AccountId"
              - Sid: S3ReplicationConfigForPause
                Effect: Allow
                Action:
                  - s3:PutReplicationConfiguration
                  - s3:GetReplicationConfiguration
                Resource: !Sub "arn:${AWS::Partition}:s3:::*"
                Condition:
                  BoolIfExists:
                    s3:IsReplicationPauseRequest: "true"
                  StringEquals:
                    s3:ResourceAccount: !Ref "AWS::AccountId"
              # aws:dynamodb:global-table-pause-replication (multi-Region isolation)
              - Sid: DynamoDbPauseReplication
                Effect: Allow
                Action:
                  - dynamodb:PutResourcePolicy
                  - dynamodb:DeleteResourcePolicy
                  - dynamodb:GetResourcePolicy
                  - dynamodb:DescribeTable
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/*"
              # Multi-Region strong consistency (MRSC) global tables only.
              - Sid: DynamoDbMrscPauseReplication
                Effect: Allow
                Action: dynamodb:InjectError
                Resource: "*"
                Condition:
                  StringEquals:
                    dynamodb:FisActionId: aws:dynamodb:global-table-pause-replication
              # aws:memorydb:multi-region-cluster-pause-replication (multi-Region isolation)
              - Sid: MemoryDbPauseReplication
                Effect: Allow
                Action:
                  - memorydb:DescribeMultiRegionClusters
                  - memorydb:PauseMultiRegionClusterReplication
                Resource: !Sub "arn:${AWS::Partition}:memorydb::${AWS::AccountId}:multiregioncluster/*"
              # Read-only lookups FIS uses to resolve and track targets. None of
              # these actions accepts a resource ARN.
              - Sid: TargetResolution
                Effect: Allow
                Action:
                  - arc-zonal-shift:ListManagedResources
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeTags
                  - ec2:DescribeInstances
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ecs:ListTasks
                  - s3:ListAllMyBuckets
                  - ssm:ListCommands
                  - tag:GetResources
                Resource: "*"
              # Experiment logging to CloudWatch Logs (design 5.3): the permissions the CloudWatch Logs
              # guide ("Logs sent to CloudWatch Logs") lists for setting up log delivery. Each test logs
              # to the /aws/fis/ngrh-tests${Env} group monitoring.yml creates in the Region its fault
              # lands in. CreateLogDelivery accepts no resource ARN. The other three are documented for
              # log-group:* in the account: the guide says a single named group does not work for them.
              # Whether FIS reads these from this role or from the invoker role is confirmed by the first
              # live run: an empty log group means CloudTrail shows which principal was denied.
              - Sid: FisLogDeliveryCreate
                Effect: Allow
                Action: logs:CreateLogDelivery
                Resource: "*"
              - Sid: FisLogDeliveryGroups
                Effect: Allow
                Action:
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*"

  # -------------------------------------------------------------------------
  # Resiliency policies. One RTO/RPO bar per tier, applied across AZ + Region.
  # DR approach ACTIVE_ACTIVE (both regions serve; data strongly consistent).
  # NOTE: AvailabilitySlo.Target units to confirm at test time (expected %).
  # -------------------------------------------------------------------------
  TierOnePolicy:
    Type: AWS::ResilienceHubV2::Policy
    Properties:
      Name: !Sub "ngrh-tier1${Env}"
      Description: "Tier-1 (revenue funnel): RTO 10m / RPO 0 -- zero data loss"
      AvailabilitySlo:
        Target: 99.99
      MultiAz: {}
      MultiRegion:
        RtoInMinutes: 10
        RpoInMinutes: 0
        DisasterRecoveryApproach: ACTIVE_ACTIVE

  TierTwoPolicy:
    Type: AWS::ResilienceHubV2::Policy
    Properties:
      Name: !Sub "ngrh-tier2${Env}"
      Description: "Tier-2 (RPO-relaxed): RTO 10m / RPO 5m -- async or transient data (catalog, checkout)"
      AvailabilitySlo:
        Target: 99.9
      MultiAz: {}
      MultiRegion:
        RtoInMinutes: 10
        RpoInMinutes: 5
        DisasterRecoveryApproach: ACTIVE_ACTIVE

  # -------------------------------------------------------------------------
  # System (the application container).
  # -------------------------------------------------------------------------
  System:
    Type: AWS::ResilienceHubV2::System
    Properties:
      Name: !Sub "resilient-microservice${Env}"
      Description: "Multi-region active/active e-commerce microservice"

  # -------------------------------------------------------------------------
  # User Journeys.
  # -------------------------------------------------------------------------
  BrowseJourney:
    Type: AWS::ResilienceHubV2::UserJourney
    Properties:
      SystemIdentifier: !GetAtt System.SystemArn
      Name: "BrowseCatalog"
      Description: "Home page, product listing, product detail"

  CheckoutJourney:
    Type: AWS::ResilienceHubV2::UserJourney
    Properties:
      SystemIdentifier: !GetAtt System.SystemArn
      Name: "CheckoutAndPlaceOrder"
      Description: "Shipping -> delivery -> payment -> confirm -> order"

  CartJourney:
    Type: AWS::ResilienceHubV2::UserJourney
    Properties:
      SystemIdentifier: !GetAtt System.SystemArn
      Name: "ManageCart"
      Description: "Add/remove items, view cart"

  ViewOrdersJourney:
    Type: AWS::ResilienceHubV2::UserJourney
    Properties:
      SystemIdentifier: !GetAtt System.SystemArn
      Name: "ViewOrders"
      Description: "Order history"

  # -------------------------------------------------------------------------
  # Services. Each spans both regions and links to the journeys it participates
  # in via AssociatedSystems.UserJourneyIds. PolicyArn = strictest tier among
  # the service's journeys.
  #
  # Resource discovery is TAG-BASED: each service's input source is a
  # `service` tag filter matching the service's own name plus `shared`. This
  # scopes discovery precisely (e.g. catalog no longer discovers checkout's
  # Redis or orders' MQ), which removes the need for negative "does not use X"
  # assertions. DependencyDiscovery stays ENABLED so the tagged seed set is
  # expanded along real dependency edges and the service is registered as a
  # traffic source. Only genuine compensating-control / strategy assertions
  # are retained.
  # -------------------------------------------------------------------------
  UiService:
    Type: AWS::ResilienceHubV2::Service
    Properties:
      Name: !Sub "ui${Env}"
      Regions: [!Ref PrimaryRegion, !Ref StandbyRegion]
      PolicyArn: !GetAtt TierOnePolicy.PolicyArn
      DependencyDiscovery: ENABLED
      PermissionModel:
        InvokerRoleName: !Ref InvokerRole
      ReportConfiguration:
        ReportOutput:
          - S3:
              BucketPath: !Sub "${NgrhBucket}/reports/"
              BucketOwner: !Ref "AWS::AccountId"
      AssociatedSystems:
        - SystemArn: !GetAtt System.SystemArn
          UserJourneyIds:
            - !GetAtt BrowseJourney.UserJourneyId
            - !GetAtt CheckoutJourney.UserJourneyId
            - !GetAtt CartJourney.UserJourneyId
            - !GetAtt ViewOrdersJourney.UserJourneyId
      InputSources:
        - ResourceConfiguration:
            ResourceTags:
              - Key: service
                Values:
                  - ui
                  - shared
      Assertions:
        # Why: without this, the assessment claims "no automated failover
        # mechanism" despite the ARC Region Switch plan being discovered.
        - Text: >-
            Regional failover is automated via ARC Region Switch plan
            (mr-rs-plan-ngrh) which pre-scales ECS to 200% and shifts
            Route 53 DNS via data-plane health checks.
        # Why: without this, the assessment generates findings about
        # missing ARC zonal shift, zonal autoshift, and ALB ATW -- which
        # are unnecessary when regional failover handles AZ impairments.
        - Text: >-
            This architecture uses regional failover as the response to
            significant AZ impairments rather than AZ-level isolation
            mechanisms (zonal shift, zonal autoshift, ALB ATW). The ARC
            Region Switch plan pre-scales the surviving region to 200%
            and shifts DNS within the RTO, making AZ-scoped mitigations
            unnecessary for this design.

  CatalogService:
    DependsOn: UiService
    Type: AWS::ResilienceHubV2::Service
    Properties:
      Name: !Sub "catalog${Env}"
      Regions: [!Ref PrimaryRegion, !Ref StandbyRegion]
      PolicyArn: !GetAtt TierTwoPolicy.PolicyArn
      DependencyDiscovery: ENABLED
      PermissionModel:
        InvokerRoleName: !Ref InvokerRole
      ReportConfiguration:
        ReportOutput:
          - S3:
              BucketPath: !Sub "${NgrhBucket}/reports/"
              BucketOwner: !Ref "AWS::AccountId"
      AssociatedSystems:
        - SystemArn: !GetAtt System.SystemArn
          UserJourneyIds:
            - !GetAtt BrowseJourney.UserJourneyId
      InputSources:
        - ResourceConfiguration:
            ResourceTags:
              - Key: service
                Values:
                  - catalog
                  - shared
      Assertions:
        # Browse RPO compensating control (decision 3): catalog is read-only
        # in-region, written by a re-runnable external ingest -> no
        # unrecoverable data loss despite Aurora Global async replication.
        - Text: >-
            Catalog is read-only in-region; data is written by an external
            ingest process from an external system of record. On regional
            failover, any unreplicated catalog updates are recovered by
            re-running ingest, so there is no unrecoverable data loss. Aurora
            Global async replication is an accepted compensating control for
            the Tier-1 RPO target.
        - Text: >-
            Catalog uses Aurora Global Database as its only data store.
        - Text: >-
            Regional failover is automated via ARC Region Switch plan
            (mr-rs-plan-ngrh) which pre-scales ECS to 200% and shifts
            Route 53 DNS via data-plane health checks.
        - Text: >-
            This architecture uses regional failover as the response to
            significant AZ impairments rather than AZ-level isolation
            mechanisms (zonal shift, zonal autoshift, ALB ATW). The ARC
            Region Switch plan pre-scales the surviving region to 200%
            and shifts DNS within the RTO, making AZ-scoped mitigations
            unnecessary for this design.

  CartService:
    DependsOn: CatalogService
    Type: AWS::ResilienceHubV2::Service
    Properties:
      Name: !Sub "cart${Env}"
      Regions: [!Ref PrimaryRegion, !Ref StandbyRegion]
      PolicyArn: !GetAtt TierOnePolicy.PolicyArn
      DependencyDiscovery: ENABLED
      PermissionModel:
        InvokerRoleName: !Ref InvokerRole
      ReportConfiguration:
        ReportOutput:
          - S3:
              BucketPath: !Sub "${NgrhBucket}/reports/"
              BucketOwner: !Ref "AWS::AccountId"
      AssociatedSystems:
        - SystemArn: !GetAtt System.SystemArn
          UserJourneyIds:
            - !GetAtt CartJourney.UserJourneyId
            - !GetAtt CheckoutJourney.UserJourneyId
      InputSources:
        - ResourceConfiguration:
            ResourceTags:
              - Key: service
                Values:
                  - cart
                  - shared
      Assertions:
        - Text: >-
            Regional failover is automated via ARC Region Switch plan
            (mr-rs-plan-ngrh) which pre-scales ECS to 200% and shifts
            Route 53 DNS via data-plane health checks.
        - Text: >-
            This architecture uses regional failover as the response to
            significant AZ impairments rather than AZ-level isolation
            mechanisms (zonal shift, zonal autoshift, ALB ATW). The ARC
            Region Switch plan pre-scales the surviving region to 200%
            and shifts DNS within the RTO, making AZ-scoped mitigations
            unnecessary for this design.

  CheckoutService:
    DependsOn: CartService
    Type: AWS::ResilienceHubV2::Service
    Properties:
      Name: !Sub "checkout${Env}"
      Regions: [!Ref PrimaryRegion, !Ref StandbyRegion]
      PolicyArn: !GetAtt TierTwoPolicy.PolicyArn
      DependencyDiscovery: ENABLED
      PermissionModel:
        InvokerRoleName: !Ref InvokerRole
      ReportConfiguration:
        ReportOutput:
          - S3:
              BucketPath: !Sub "${NgrhBucket}/reports/"
              BucketOwner: !Ref "AWS::AccountId"
      AssociatedSystems:
        - SystemArn: !GetAtt System.SystemArn
          UserJourneyIds:
            - !GetAtt CheckoutJourney.UserJourneyId
      InputSources:
        - ResourceConfiguration:
            ResourceTags:
              - Key: service
                Values:
                  - checkout
                  - shared
      Assertions:
        - Text: >-
            Regional failover is automated via ARC Region Switch plan
            (mr-rs-plan-ngrh) which pre-scales ECS to 200% and shifts
            Route 53 DNS via data-plane health checks.
        - Text: >-
            This architecture uses regional failover as the response to
            significant AZ impairments rather than AZ-level isolation
            mechanisms (zonal shift, zonal autoshift, ALB ATW). The ARC
            Region Switch plan pre-scales the surviving region to 200%
            and shifts DNS within the RTO, making AZ-scoped mitigations
            unnecessary for this design.

  OrdersService:
    DependsOn: CheckoutService
    Type: AWS::ResilienceHubV2::Service
    Properties:
      Name: !Sub "orders${Env}"
      Regions: [!Ref PrimaryRegion, !Ref StandbyRegion]
      PolicyArn: !GetAtt TierOnePolicy.PolicyArn
      DependencyDiscovery: ENABLED
      PermissionModel:
        InvokerRoleName: !Ref InvokerRole
      ReportConfiguration:
        ReportOutput:
          - S3:
              BucketPath: !Sub "${NgrhBucket}/reports/"
              BucketOwner: !Ref "AWS::AccountId"
      AssociatedSystems:
        - SystemArn: !GetAtt System.SystemArn
          UserJourneyIds:
            - !GetAtt CheckoutJourney.UserJourneyId
            - !GetAtt ViewOrdersJourney.UserJourneyId
      InputSources:
        - ResourceConfiguration:
            ResourceTags:
              - Key: service
                Values:
                  - orders
                  - shared
      Assertions:
        - Text: >-
            Regional failover is automated via ARC Region Switch plan
            (mr-rs-plan-ngrh) which pre-scales ECS to 200% and shifts
            Route 53 DNS via data-plane health checks.
        - Text: >-
            This architecture uses regional failover as the response to
            significant AZ impairments rather than AZ-level isolation
            mechanisms (zonal shift, zonal autoshift, ALB ATW). The ARC
            Region Switch plan pre-scales the surviving region to 200%
            and shifts DNS within the RTO, making AZ-scoped mitigations
            unnecessary for this design.
        - Text: >-
            RabbitMQ is used only for post-commit event notification
            (OrderCreatedEvent published after DSQL transaction commits).
            The order of record is durably stored in Aurora DSQL (RPO 0)
            before any MQ publish. Lost MQ messages affect downstream
            notifications only, not order data integrity.

  AssetsService:
    DependsOn: OrdersService
    Type: AWS::ResilienceHubV2::Service
    Properties:
      Name: !Sub "assets${Env}"
      Regions: [!Ref PrimaryRegion, !Ref StandbyRegion]
      PolicyArn: !GetAtt TierTwoPolicy.PolicyArn
      DependencyDiscovery: ENABLED
      PermissionModel:
        InvokerRoleName: !Ref InvokerRole
      ReportConfiguration:
        ReportOutput:
          - S3:
              BucketPath: !Sub "${NgrhBucket}/reports/"
              BucketOwner: !Ref "AWS::AccountId"
      AssociatedSystems:
        - SystemArn: !GetAtt System.SystemArn
          UserJourneyIds:
            - !GetAtt BrowseJourney.UserJourneyId
      InputSources:
        - ResourceConfiguration:
            ResourceTags:
              - Key: service
                Values:
                  - assets
                  - shared
      Assertions:
        - Text: >-
            Assets is a stateless nginx container serving static files
            (images, CSS, JS). It has no data store, no session state,
            and no further dependencies.
        - Text: >-
            Regional failover is automated via ARC Region Switch plan
            (mr-rs-plan-ngrh) which pre-scales ECS to 200% and shifts
            Route 53 DNS via data-plane health checks.
        - Text: >-
            This architecture uses regional failover as the response to
            significant AZ impairments rather than AZ-level isolation
            mechanisms (zonal shift, zonal autoshift, ALB ATW). The ARC
            Region Switch plan pre-scales the surviving region to 200%
            and shifts DNS within the RTO, making AZ-scoped mitigations
            unnecessary for this design.

Outputs:
  SystemArn:
    Value: !GetAtt System.SystemArn
  TierOnePolicyArn:
    Value: !GetAtt TierOnePolicy.PolicyArn
  TierTwoPolicyArn:
    Value: !GetAtt TierTwoPolicy.PolicyArn
  NgrhBucketName:
    Description: NGRH shared bucket (reports, design files). Empty before stack delete.
    Value: !Ref NgrhBucket
  InvokerRoleName:
    Description: Role NGRH assumes for discovery, assessments and tests (each service's invoker role)
    Value: !Ref InvokerRole
  TestExperimentRoleName:
    Description: IAM role to choose when creating an NGRH test (FIS assumes it to inject the faults)
    Value: !Ref TestExperimentRole
  TestExperimentRoleArn:
    Value: !GetAtt TestExperimentRole.Arn
  ServiceArns:
    Description: Comma-separated service ARNs (used by `make ngrh-assess`)
    Value: !Join
      - ","
      - - !GetAtt UiService.ServiceArn
        - !GetAtt CatalogService.ServiceArn
        - !GetAtt CartService.ServiceArn
        - !GetAtt CheckoutService.ServiceArn
        - !GetAtt OrdersService.ServiceArn
        - !GetAtt AssetsService.ServiceArn
  # One output per service, so the test tooling can name the service a test
  # runs on without parsing ServiceArns.
  UiServiceArn:
    Value: !GetAtt UiService.ServiceArn
  CatalogServiceArn:
    Value: !GetAtt CatalogService.ServiceArn
  CartServiceArn:
    Value: !GetAtt CartService.ServiceArn
  CheckoutServiceArn:
    Value: !GetAtt CheckoutService.ServiceArn
  OrdersServiceArn:
    Value: !GetAtt OrdersService.ServiceArn
  AssetsServiceArn:
    Value: !GetAtt AssetsService.ServiceArn
