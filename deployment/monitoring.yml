  # -------------------------------------------------------------------------
  # Journey alarms (design 5.5). One per canary in this Region: the lcl view
  # (this Region's canary against this Region's ALB), the rmt view (this
  # Region's canary against the other Region's ALB) and the global view
  # (this Region's canary against the Route 53 name). So
  # journey-rmt-orders-us-west-2 is us-west-2's view of us-east-1's orders
  # journey. Every canary enters through the ALB and ui (design 4.3), so a
  # failure in any service on a journey's path fails that journey.
  # 2 of 3 one-minute datapoints below 50%: one failed run never alarms.
  # Missing data is breaching, so an observer that stops reporting counts as
  # failing; the plan's triggers (step 11) require both Regions to agree.
  # -------------------------------------------------------------------------
  JourneyLclHomeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'journey-lcl-home-${AWS::Region}${Env}'
      AlarmDescription: Home journey failing in this Region, seen from this Region (lcl-rgnl-home).
      Tags:
        - Key: service
          Value: shared
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Sub 'lcl-rgnl-home${Env}'
      Statistic: Average
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 50
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  JourneyLclCartAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'journey-lcl-cart-${AWS::Region}${Env}'
      AlarmDescription: Cart journey failing in this Region, seen from this Region (lcl-rgnl-cart).
