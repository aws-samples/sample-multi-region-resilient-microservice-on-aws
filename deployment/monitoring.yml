  # Any journey failing in this Region, seen from this Region. A trigger that
  # fails over Region A requires this alarm OK in B, so an event that hits
  # both Regions can't move traffic.
  RegionDegradedAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub 'region-degraded-${AWS::Region}${Env}'
      AlarmDescription: At least one journey fails in this Region, seen from this Region.
      Tags:
        - Key: service
          Value: shared
      AlarmRule: !Sub >-
        ALARM(${JourneyLclHomeAlarm})
        OR ALARM(${JourneyLclCartAlarm})
        OR ALARM(${JourneyLclCatalogAlarm})
        OR ALARM(${JourneyLclOrdersAlarm})

  # -------------------------------------------------------------------------
  # Hop alarms (design 5.5): which hop failed, since a journey alarm can't
  # say. ui's come from its ALB target group; the back-ends' from Service
  # Connect (AWS/ECS by TargetDiscoveryName, summed over every caller in the
  # Region). Service Connect counts only responses the application sends, so
  # a back-end that hangs past its 3-second limit shows as slow, while its
  # caller's errors alarm fires. Missing data is not breaching: no traffic
  # is not a failure. Tagged with their own service for NGRH discovery.
  # ALB TargetResponseTime is in seconds, Service Connect's in milliseconds.
  # -------------------------------------------------------------------------
  HopUiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'hop-ui-errors-${AWS::Region}${Env}'
      AlarmDescription: ui returned 5xx responses to the ALB.
      Tags:
        - Key: service
          Value: ui
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref UiLoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref UiTargetGroupFullName
