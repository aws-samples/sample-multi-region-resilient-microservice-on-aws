              Value: "15"
          Command:
            - /bin/bash
            - -c
            - >-
              if ! [[ $SHUTDOWN_DELAY_SECONDS =~ ^[0-9]+$ ]]; then echo "SHUTDOWN_DELAY_SECONDS must be a whole number of seconds" 1>&2; exit 1; fi; release() { echo "Stop requested: holding the application for $SHUTDOWN_DELAY_SECONDS seconds"; sleep "$SHUTDOWN_DELAY_SECONDS"; kill "$SLEEPER_PID" 2>/dev/null; echo "Releasing the application"; exit 0; }; trap release SIGTERM SIGINT; sleep infinity & SLEEPER_PID=$!; wait "$SLEEPER_PID"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs
        -
          Name: "orders"
          # Starting after the CloudWatch agent means stopping before it; see
          # carts.
          DependsOn:
            - ContainerName: init
              Condition: SUCCESS
            - ContainerName: ecs-cwagent
              Condition: START
          MountPoints: 
            - SourceVolume: opentelemetry-auto-instrumentation
              ContainerPath: /otel-auto-instrumentation
              ReadOnly: false
          PortMappings:
            - ContainerPort: 8080
              AppProtocol: http
              Name: orders
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/orders${Env}:${Tag}"
          Cpu: 0
          MemoryReservation: 50
          Essential: true
          # Same check as carts. It must use the readiness group: the aggregate
          # /actuator/health includes the database and RabbitMQ and returns 503
          # when the broker is unreachable, which would make ECS replace every
          # orders task during a broker outage.
          HealthCheck:
            Command:
