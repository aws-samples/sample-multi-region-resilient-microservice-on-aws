          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cloudwatch-agent${Env}:latest'
          Essential: true
          Secrets: 
            - Name: CW_CONFIG_CONTENT
              ValueFrom: !Ref CWAgentConfSSM
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/ecs-cwagent
              awslogs-create-group: true
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs
        -
          Name: init
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/adot-autoinstrumentation-java${Env}:v2.29.0'
