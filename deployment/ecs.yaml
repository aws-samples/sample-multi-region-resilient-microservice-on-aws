  OrdersTaskDefinition:
    Type:  AWS::ECS::TaskDefinition
    Properties:
      Volumes: 
        - Name:  opentelemetry-auto-instrumentation
      ExecutionRoleArn: !GetAtt OrdersTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt OrdersTaskExecutionRole.Arn
      NetworkMode: awsvpc 
