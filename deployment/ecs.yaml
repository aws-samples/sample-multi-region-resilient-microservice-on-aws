            - Name: DSQL_ENDPOINT
              Value: !Sub '{{resolve:ssm:orders-dsql-cluster-Endpoint${Env}}}'
            - Name: DSQL_AUTH_HOSTNAME
              Value: !Sub '{{resolve:ssm:orders-dsql-cluster-PublicEndpoint${Env}}}'
            - Name: DSQL_REGION
              Value: !Ref AWS::Region
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: OTEL_RESOURCE_ATTRIBUTES
              Value: !Sub "service.name=orders${Env},service.namespace=retail-store-ar,aws.log.group.names=${LogGroup}"
            - Name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED
              Value: true
            - Name: OTEL_EXPORTER_OTLP_PROTOCOL
              Value: http/protobuf
            - Name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT
              Value: http://localhost:4316/v1/metrics
            - Name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              Value: http://localhost:4316/v1/traces
            - Name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              Value: http://localhost:4316/v1/metrics
            - Name: OTEL_TRACES_SAMPLER
              Value: xray
            - Name: OTEL_PROPAGATORS
              Value: "tracecontext,baggage,b3,xray"
            - Name: JAVA_TOOL_OPTIONS
              Value: " -javaagent:/otel-auto-instrumentation/javaagent.jar"
          Secrets:
            -
              Name: "SPRING_RABBITMQ_USERNAME"
              ValueFrom: !Sub "${MqSecret}:username::"
            -
              Name: "SPRING_RABBITMQ_ADDRESSES"
              ValueFrom: !Sub "${MqSecret}:host::"
            -
              Name: "SPRING_RABBITMQ_PASSWORD"
              ValueFrom: !Sub "${MqSecret}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs  
