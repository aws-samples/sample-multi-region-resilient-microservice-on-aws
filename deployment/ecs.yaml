              Value: !Sub "service.name=checkout${Env},service.namespace=retail-store-ar,aws.log.group.names=${LogGroup}"
            - Name: "ENDPOINTS_ORDERS"
              Value: http://orders:8080
            - Name: "REDIS_URL"
              Value: !Sub "rediss://${CheckoutEcCluster.PrimaryEndPoint.Address}:${CheckoutEcCluster.PrimaryEndPoint.Port}"
            - Name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED
              Value: true
            - Name: OTEL_EXPORTER_OTLP_PROTOCOL
              Value: http/protobuf
            - Name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT
              Value: http://localhost:4316/v1/metrics
            - Name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              Value: http://localhost:4316/v1/traces
            - Name: OTEL_TRACES_SAMPLER
              Value: xray
            - Name: OTEL_PROPAGATORS
              Value: "xray"
            - Name: NODE_OPTIONS
              Value: "--require /otel-auto-instrumentation-node/autoinstrumentation.js"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs  
        -
          Name: ecs-cwagent
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cloudwatch-agent${Env}:latest'
          Essential: true
          Secrets: 
            - Name: CW_CONFIG_CONTENT
              ValueFrom: !Ref CWAgentConfSSM
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/ecs-cwagent
              awslogs-create-group: true
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs
        -
          Name: init
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/adot-autoinstrumentation-node${Env}:v0.12.0'
          Essential: false
          MountPoints: 
            - SourceVolume: opentelemetry-auto-instrumentation-node
              ContainerPath: /otel-auto-instrumentation-node
              ReadOnly: false
          Command: 
            - cp
            - -a
            - /autoinstrumentation/.
            - /otel-auto-instrumentation-node
  CheckoutService:
    Type: AWS::ECS::Service
    DependsOn:
      - OrdersService
    Properties:
      ServiceName: !Sub checkout${Env}
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Cluster:  !Ref EcsCluster
      DesiredCount: 2
      TaskDefinition: !Ref CheckoutTaskDefinition
      Tags:
        - Key: "service"
          Value: "checkout"
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Sub retail-store-ar${Env}
        Services:
          -
            ClientAliases:
              -
                DnsName: checkout
                Port: 8080
            PortName: checkout
            Timeout:
              PerRequestTimeoutSeconds: 3
              IdleTimeoutSeconds: 300
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: 
            - !GetAtt sgTask.GroupId
          Subnets:
            - !Sub '{{resolve:ssm:Subnet1${Env}}}'
            - !Sub '{{resolve:ssm:Subnet2${Env}}}'
            - !Sub '{{resolve:ssm:Subnet3${Env}}}'

  #UI Service
  UiTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: 
                - "ecs-tasks.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - !Ref FisTaskSsmManagedPolicy
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      Tags:
        - Key: "service"
          Value: "ui"
      Policies:
        - PolicyName: ecs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: "Allow"
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/CWAgentConf${Env}'
              Action:
                - "ssm:GetParameters"
                - "ssm:DescribeParameters"
  UiTaskDefinition:
    DependsOn:
      - CatalogService
    Type:  AWS::ECS::TaskDefinition
    Properties:
      Volumes: 
        - Name:  opentelemetry-auto-instrumentation
      ExecutionRoleArn: !GetAtt UiTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt UiTaskExecutionRole.Arn
      NetworkMode: awsvpc 
      # FIS ECS task actions: PidMode task lets the SSM agent sidecar reach the
      # application's processes, and EnableFaultInjection turns on the ECS
      # fault-injection endpoints that FIS network faults use on Fargate.
      PidMode: task
      EnableFaultInjection: true
      Cpu: 1024
      Memory: 2048
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      Tags:
        - Key: "service"
          Value: "ui"
      ContainerDefinitions:
        # FIS fault-injection sidecar, as documented for aws:ecs:task-* actions:
        # it registers the task as an SSM managed instance tagged ECS_TASK_ARN,
        # which is how FIS finds the task. The image is this account's mirror
        # (mirror-sidecar-buildspec.yml) with the packages the start script and
        # the fault documents need baked in, because the task subnets have no
        # internet route. Non-essential: the application keeps serving if the
        # sidecar stops.
        - Name: amazon-ssm-agent
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/amazon-ssm-agent${Env}:latest'
          Cpu: 0
          Essential: false
          Command:
            - /bin/bash
            - -c
            - >-
              set -e; term_handler() { echo "Deleting SSM activation $ACTIVATION_ID"; if ! aws ssm delete-activation --activation-id $ACTIVATION_ID --region $ECS_TASK_REGION; then echo "SSM activation $ACTIVATION_ID failed to be deleted" 1>&2; fi; MANAGED_INSTANCE_ID=$(jq -e -r .ManagedInstanceID /var/lib/amazon/ssm/registration); echo "Deregistering SSM Managed Instance $MANAGED_INSTANCE_ID"; if ! aws ssm deregister-managed-instance --instance-id $MANAGED_INSTANCE_ID --region $ECS_TASK_REGION; then echo "SSM Managed Instance $MANAGED_INSTANCE_ID failed to be deregistered" 1>&2; fi; kill -SIGTERM $SSM_AGENT_PID; }; trap term_handler SIGTERM SIGINT; if [[ -z $MANAGED_INSTANCE_ROLE_NAME ]]; then echo "Environment variable MANAGED_INSTANCE_ROLE_NAME not set, exiting" 1>&2; exit 1; fi; if ! ps ax | grep amazon-ssm-agent | grep -v grep > /dev/null; then if [[ -n $ECS_CONTAINER_METADATA_URI_V4 ]] ; then echo "Found ECS Container Metadata, running activation with metadata"; TASK_METADATA=$(curl "${ECS_CONTAINER_METADATA_URI_V4}/task"); ECS_TASK_AVAILABILITY_ZONE=$(echo $TASK_METADATA | jq -e -r '.AvailabilityZone'); ECS_TASK_ARN=$(echo $TASK_METADATA | jq -e -r '.TaskARN'); ECS_TASK_REGION=$(echo $ECS_TASK_AVAILABILITY_ZONE | sed 's/.$//'); ECS_TASK_AVAILABILITY_ZONE_REGEX='^(af|ap|ca|cn|eu|me|sa|us|us-gov)-(central|north|(north(east|west))|south|south(east|west)|east|west)-[0-9]{1}[a-z]{1}$'; if ! [[ $ECS_TASK_AVAILABILITY_ZONE =~ $ECS_TASK_AVAILABILITY_ZONE_REGEX ]]; then echo "Error extracting Availability Zone from ECS Container Metadata, exiting" 1>&2; exit 1; fi; ECS_TASK_ARN_REGEX='^arn:(aws|aws-cn|aws-us-gov):ecs:[a-z0-9-]+:[0-9]{12}:task/[a-zA-Z0-9_-]+/[a-zA-Z0-9]+$'; if ! [[ $ECS_TASK_ARN =~ $ECS_TASK_ARN_REGEX ]]; then echo "Error extracting Task ARN from ECS Container Metadata, exiting" 1>&2; exit 1; fi; CREATE_ACTIVATION_OUTPUT=$(aws ssm create-activation --iam-role $MANAGED_INSTANCE_ROLE_NAME --tags Key=ECS_TASK_AVAILABILITY_ZONE,Value=$ECS_TASK_AVAILABILITY_ZONE Key=ECS_TASK_ARN,Value=$ECS_TASK_ARN Key=FAULT_INJECTION_SIDECAR,Value=true --region $ECS_TASK_REGION); ACTIVATION_CODE=$(echo $CREATE_ACTIVATION_OUTPUT | jq -e -r .ActivationCode); ACTIVATION_ID=$(echo $CREATE_ACTIVATION_OUTPUT | jq -e -r .ActivationId); if ! amazon-ssm-agent -register -code $ACTIVATION_CODE -id $ACTIVATION_ID -region $ECS_TASK_REGION; then echo "Failed to register with AWS Systems Manager (SSM), exiting" 1>&2; exit 1; fi; amazon-ssm-agent & SSM_AGENT_PID=$!; wait $SSM_AGENT_PID; else echo "ECS Container Metadata not found, exiting" 1>&2; exit 1; fi; else echo "SSM agent is already running, exiting" 1>&2; exit 1; fi
          Environment:
            - Name: MANAGED_INSTANCE_ROLE_NAME
              Value: !Ref FisSsmManagedInstanceRole
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs
        -
          Name: "ui"
          DependsOn:
            - ContainerName: init
              Condition: SUCCESS
          MountPoints: 
            - SourceVolume: opentelemetry-auto-instrumentation
              ContainerPath: /otel-auto-instrumentation
              ReadOnly: false
          PortMappings:
            - ContainerPort: 8080
              Name: ui
              AppProtocol: http
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/ui${Env}:${Tag}"
          Cpu: 0
          MemoryReservation: 50
          Essential: true
          Environment:
            - Name: OTEL_RESOURCE_ATTRIBUTES
              Value: !Sub "service.name=ui${Env},service.namespace=retail-store-ar,aws.log.group.names=${LogGroup}"
            - Name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED
              Value: true
            - Name: OTEL_EXPORTER_OTLP_PROTOCOL
              Value: http/protobuf
            - Name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT
              Value: http://localhost:4316/v1/metrics
            - Name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              Value: http://localhost:4316/v1/traces
            - Name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              Value: http://localhost:4316/v1/metrics
            - Name: OTEL_TRACES_SAMPLER
              Value: xray
            - Name: OTEL_PROPAGATORS
              Value: "tracecontext,baggage,b3,xray"
            - Name: JAVA_TOOL_OPTIONS
              Value: " -javaagent:/otel-auto-instrumentation/javaagent.jar" 
            - Name: "ENDPOINTS_CATALOG"
              Value: http://catalog:8080
            - Name: "ENDPOINTS_CARTS"
              Value: http://carts:8080
            - Name: "ENDPOINTS_CHECKOUT"
              Value: http://checkout:8080
            - Name: "ENDPOINTS_ORDERS"
              Value: http://orders:8080
            - Name: "ENDPOINTS_ASSETS"
              Value: http://assets:8080
            # ui -> downstream client timeouts. These MUST stay above the
            # internal services' PerRequestTimeoutSeconds (3s, set on each
            # ServiceConnectConfiguration below/above) so the Service Connect
            # proxy times out first and can attribute the failure upstream,
            # which is what enables its retries and outlier detection.
            - Name: "ENDPOINTS_TIMEOUT_CONNECT_MILLIS"
              Value: "1000"
            - Name: "ENDPOINTS_TIMEOUT_READ_SECONDS"
              Value: "10"
            - Name: "ENDPOINTS_TIMEOUT_WRITE_SECONDS"
              Value: "10"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs  
        -
          Name: ecs-cwagent
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cloudwatch-agent${Env}:latest'
          Essential: true
          Secrets: 
            - Name: CW_CONFIG_CONTENT
              ValueFrom: !Ref CWAgentConfSSM
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/ecs-cwagent
              awslogs-create-group: true
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs
        -
          Name: init
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/adot-autoinstrumentation-java${Env}:v2.29.0'
          Essential: false
          MountPoints: 
            - SourceVolume: opentelemetry-auto-instrumentation
              ContainerPath: /otel-auto-instrumentation
              ReadOnly: false
          Command: 
            - cp
            - /javaagent.jar
            - /otel-auto-instrumentation/javaagent.jar
  UiService:
    Type: AWS::ECS::Service
    DependsOn:
      - CartsService
      - OrdersService
      - AssetsService
      - CatalogService
      - CheckoutService
    Properties:
      ServiceName: !Sub ui${Env}
      LoadBalancers:
        - TargetGroupArn: !Ref AlbTargetGroup
          ContainerName: ui 
          ContainerPort: 8080
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Cluster:  !Ref EcsCluster
      DesiredCount: 2
      TaskDefinition: !Ref UiTaskDefinition
      Tags:
        - Key: "service"
          Value: "ui"
      ServiceConnectConfiguration:
        Enabled: true
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroup
            awslogs-region: !Sub ${AWS::Region}
            awslogs-stream-prefix: ecs  
        Namespace: !Sub retail-store-ar${Env}
        Services:
          -
            ClientAliases:
              -
                DnsName: ui
                Port: 8080
            PortName: ui
            Timeout:
              PerRequestTimeoutSeconds: 15
              IdleTimeoutSeconds: 300
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: 
            - !GetAtt sgTask.GroupId
          Subnets:
            - !Sub '{{resolve:ssm:Subnet1${Env}}}'
            - !Sub '{{resolve:ssm:Subnet2${Env}}}'
            - !Sub '{{resolve:ssm:Subnet3${Env}}}'

#Secrets
  AlbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub Alb-${AWS::Region}${Env}
      Description: "Alb Info"
      KmsKeyId: !Ref KmsKey
      SecretString: !Sub "{\"DnsName\":\"${Alb.DNSName}\",\"HostedZoneId\":\"${Alb.CanonicalHostedZoneID}\"}"
      ReplicaRegions:
        - Region: !If [isPrimary, us-west-2, us-east-1]

  EcsClusterArnSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'mr-app/ecs-cluster-arn-${AWS::Region}${Env}'
      SecretString: !GetAtt EcsCluster.Arn
      KmsKeyId: !Ref KmsKey
      ReplicaRegions:
        - Region: !If [isPrimary, !Ref StandbyRegion, !Ref PrimaryRegion]

  OrdersCreatedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: !Sub 'Orders-Created-${AWS::Region}'
      FilterPattern: 'c.a.s.o.s.OrderService                    Created Order'
      LogGroupName: !Ref LogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "ecommerce"
          MetricName: !Sub 'OrdersCreated${Env}'

  # Auto Scaling - both regions scale based on CPU utilization
  CartsScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: 2
      ResourceId: !Sub
        - 'service/${ClusterName}/${ServiceName}'
        - ClusterName: !Select [1, !Split ["/", !GetAtt EcsCluster.Arn]]
          ServiceName: !GetAtt CartsService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  CartsScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'carts-scaling${Env}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref CartsScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  OrdersScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: 2
      ResourceId: !Sub
        - 'service/${ClusterName}/${ServiceName}'
        - ClusterName: !Select [1, !Split ["/", !GetAtt EcsCluster.Arn]]
          ServiceName: !GetAtt OrdersService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  OrdersScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'orders-scaling${Env}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref OrdersScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  AssetsScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: 2
      ResourceId: !Sub
        - 'service/${ClusterName}/${ServiceName}'
        - ClusterName: !Select [1, !Split ["/", !GetAtt EcsCluster.Arn]]
          ServiceName: !GetAtt AssetsService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  AssetsScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'assets-scaling${Env}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AssetsScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  CatalogScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: 2
      ResourceId: !Sub
        - 'service/${ClusterName}/${ServiceName}'
        - ClusterName: !Select [1, !Split ["/", !GetAtt EcsCluster.Arn]]
          ServiceName: !GetAtt CatalogService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  CatalogScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'catalog-scaling${Env}'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref CatalogScalableTarget
