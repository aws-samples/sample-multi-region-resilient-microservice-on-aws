    Properties:
      MaxCapacity: 10
      MinCapacity: 2
      ResourceId: !Sub
        - 'service/${ClusterName}/${ServiceName}'
        - ClusterName: !Select [1, !Split ["/", !GetAtt EcsCluster.Arn]]
