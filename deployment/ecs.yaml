        # FIS fault-injection sidecar, as documented for aws:ecs:task-* actions:
        # it registers the task as an SSM managed instance tagged ECS_TASK_ARN,
        # which is how FIS finds the task. The image is this account's mirror
        # (mirror-sidecar-buildspec.yml) with the packages the start script and
        # the fault documents need baked in, because the task subnets have no
        # internet route. Non-essential: the application keeps serving if the
        # sidecar stops.
