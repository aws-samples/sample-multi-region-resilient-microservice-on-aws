AWSTemplateFormatVersion: "2010-09-09"
Description: "Applications"

Parameters:
  Env:
    Type: String
    Default: ''
    Description: String to enable multiple deployments per AWS region
  PrimaryRegion:
    Type: String
    Description: Enter the Primary Region
    Default: "us-east-1"
  StandbyRegion:
    Type: String
    Description: Enter the Standby Region
    Default: "us-west-2"
  Tag:
    Type: String
    Description: Docker image tag
  KmsKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: KmsKey
    Description: CMK Id
  VpcId:
    Type: String
    Description: VPC ID from the baseVpc stack

Mappings:
  RegionCidrMap:
    us-east-1:
      VPCCidrBlock: "10.1.0.0/16"
    us-west-2:
      VPCCidrBlock: "10.2.0.0/16"

Conditions:
  isPrimary: !Equals
    - !Ref AWS::Region
    - us-east-1
Resources:
  # --- FIS fault injection on Fargate (aws:ecs:task-* actions) ---
  # https://docs.aws.amazon.com/fis/latest/userguide/ecs-task-actions.html
  # The amazon-ssm-agent sidecar in each task registers the task as an SSM
  # managed instance tagged ECS_TASK_ARN, which is how FIS finds it. This role
  # is attached to those managed instances: SSM core, plus cleaning up its own
  # activation and registration when the task stops.
  FisSsmManagedInstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "SSM activation and managed-instance IDs are created at task start and cannot be scoped in advance."
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ssm:DeleteActivation and ssm:DeregisterManagedInstance act on activation and managed-instance IDs created at task start; the FIS documentation grants them on '*'."
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "ssm.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: "service"
          Value: "shared"
      Policies:
        - PolicyName: fis-activation-cleanup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Resource: "*"
                Action:
                  - "ssm:DeleteActivation"
                  - "ssm:DeregisterManagedInstance"

  # Attached to every task role: the sidecar creates its SSM activation at task
  # start and passes the managed-instance role to SSM.
  FisTaskSsmManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "ssm:CreateActivation and ssm:AddTagsToResource on a new activation cannot be scoped to a resource in advance."
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "ssm:CreateActivation and ssm:AddTagsToResource act on an activation created at task start; the FIS documentation grants them on '*'."
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Resource: "*"
            Action:
              - "ssm:CreateActivation"
              - "ssm:AddTagsToResource"
          - Effect: "Allow"
            Resource: !GetAtt FisSsmManagedInstanceRole.Arn
            Action:
              - "iam:PassRole"

  #Backends
  OrdersMqBroker:
    Type: "AWS::AmazonMQ::Broker"
    Properties:
      AutoMinorVersionUpgrade: true
      BrokerName: !Sub "retail-store-ar-ordersmq${Env}"
      DeploymentMode: "SINGLE_INSTANCE"
      EngineType: "RabbitMQ"
      EngineVersion: "3.13"
      HostInstanceType: "mq.m7g.medium"
      PubliclyAccessible: false
      StorageType: "ebs"
      AuthenticationStrategy: "simple"
      MaintenanceWindowStartTime: 
          DayOfWeek: "SUNDAY"
          TimeOfDay: "03:00"
          TimeZone: "UTC"
      Logs: 
          General: true
      SecurityGroups: 
        - !Ref sgMq
      SubnetIds: 
        - !Sub '{{resolve:ssm:Subnet1${Env}}}'
      Tags: 
        - 
          Key: "environment-name"
          Value: "retail-store-ar"
        - 
          Key: "created-by"
          Value: "retail-store-sample-app"
        - 
          Key: "Name"
          Value: "retail-store-arordersmq-broker"
        -
          Key: "service"
          Value: "orders"
      EncryptionOptions: 
          UseAwsOwnedKey: true
      Users:
        - 
          Username: mq
          Password: !Sub '{{resolve:secretsmanager:${MqPassword}}}'

  CheckoutEcCluster:
    Type: "AWS::ElastiCache::ReplicationGroup"
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_31
            comment: "Auth token requires app code changes. TLS and at-rest encryption enabled. Redis in private subnet with SG-restricted access."
    Properties:
      ReplicationGroupDescription: "Redis replication group for checkout service"
      CacheNodeType: "cache.t3.micro"
      Engine: "redis"
      EngineVersion: "7.1"
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      PreferredMaintenanceWindow: "wed:03:00-wed:04:00"
      CacheParameterGroupName: !Ref CheckoutEcParameterGroup
      CacheSubnetGroupName: !Ref CheckoutEcSubnetGroup
      AutoMinorVersionUpgrade: true
      SecurityGroupIds: 
        - !Ref sgRedis
      SnapshotRetentionLimit: 0
      SnapshotWindow: "06:30-07:30"
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      Tags: 
        - 
          Key: "environment-name"
          Value: "retail-store-ar"
        - 
          Key: "created-by"
          Value: "retail-store-sample-app"
        - 
          Key: "Name"
          Value: "retail-store-ar-checkout"
        -
          Key: "service"
          Value: "checkout"
  CheckoutEcSubnetGroup:
      Type: "AWS::ElastiCache::SubnetGroup"
      Properties:
        Description: "Elasticache subnet group for retail-store-ar-checkout"
        SubnetIds: 
          - !Sub '{{resolve:ssm:Subnet1${Env}}}'
          - !Sub '{{resolve:ssm:Subnet2${Env}}}'
          - !Sub '{{resolve:ssm:Subnet3${Env}}}'
  CheckoutEcParameterGroup:
    Type: "AWS::ElastiCache::ParameterGroup"
    Properties:
      CacheParameterGroupFamily: "redis7"
      Description: "Elasticache parameter group for retail-store-ar-checkout"

  #Security Groups  
  sgTask:
    Type: AWS::EC2::SecurityGroup
    Properties: 
      VpcId: !Ref VpcId
      GroupDescription: ECS Task
      Tags:
        - Key: service
          Value: shared
      SecurityGroupIngress:
        -
          SourceSecurityGroupId: !Ref sgAlb
          IpProtocol: tcp
          FromPort: 8080
          ToPort:  8080
          Description: 'Allow ingress traffic'
      SecurityGroupEgress: 
        - 
          CidrIp: "0.0.0.0/0"
          Description: "Allow all egress"
          IpProtocol: "-1"
  sgTaskIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      SourceSecurityGroupId: !Ref sgTask
      IpProtocol: tcp
      FromPort: 8080
      ToPort:  8080
      GroupId: !GetAtt sgTask.GroupId
      Description: 'Allow Ingress Traffic'
  VPCEndpointSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointSecretsManagerSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref sgTask
      Description: 'Allow ECS tasks to access Secrets Manager VPC endpoint'
  VPCEndpointSSMSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointSSMSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref sgTask
      Description: 'Allow ECS tasks to access SSM VPC endpoint'
  VPCEndpointECRApiSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointECRApiSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access ECR API VPC endpoint'
  VPCEndpointECRDkrSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointECRDkrSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access ECR Docker VPC endpoint'
  VPCEndpointLogsSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointLogsSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access CloudWatch Logs VPC endpoint'
  VPCEndpointSTSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointSTSSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access STS VPC endpoint'
  VPCEndpointKMSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointKMSSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access KMS VPC endpoint'
  VPCEndpointMonitoringSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointMonitoringSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access CloudWatch Monitoring VPC endpoint'
  VPCEndpointXRaySecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointXRaySGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access X-Ray VPC endpoint'
  VPCEndpointECSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointECSSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access ECS VPC endpoint'
  VPCEndpointDSQLSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointDSQLSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access DSQL VPC endpoint'
  VPCEndpointDSQLSecurityGroupIngress5432:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Sub '{{resolve:ssm:VPCEndpointDSQLSGId${Env}}}'
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt sgTask.GroupId
      Description: 'Allow ECS tasks to access DSQL on PostgreSQL port'
  sgAlb:
    Type: AWS::EC2::SecurityGroup
    Properties: 
      VpcId: !Ref VpcId
      GroupDescription: ECS Alb
      Tags:
        - Key: service
          Value: shared
      SecurityGroupIngress:
        - CidrIp: !Sub '{{resolve:ssm:VpcCidr${Env}}}'
          IpProtocol: tcp
          FromPort: 80
          ToPort:  80
          Description: 'Allow HTTP ingress from local VPC CIDR'
        - CidrIp: !If
            - isPrimary
            - !FindInMap [RegionCidrMap, !Ref StandbyRegion, VPCCidrBlock]
            - !FindInMap [RegionCidrMap, !Ref PrimaryRegion, VPCCidrBlock]
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          Description: 'Allow HTTP ingress from remote VPC CIDR for cross-region canaries'
      SecurityGroupEgress: 
        - 
          CidrIp: "0.0.0.0/0"
          Description: "Allow all egress"
          IpProtocol: "-1"
  sgMq:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "security group for MQ Broker"
      Tags: 
        - 
          Key: "environment-name"
          Value: "retail-store-ar"
        - 
          Key: "Name"
          Value: "retail-store-ar-orders-mq-broker"
        - 
          Key: "created-by"
          Value: "retail-store-sample-app"
        -
          Key: "service"
          Value: "orders"
      VpcId: !Ref VpcId
      SecurityGroupIngress: 
        - 
          SourceSecurityGroupId: !Ref sgTask
          SourceSecurityGroupOwnerId: !Ref AWS::AccountId
          Description: "Allow all ports"
          FromPort: 0
          IpProtocol: "tcp"
          ToPort: 65535
      SecurityGroupEgress: 
        - 
          CidrIp: "0.0.0.0/0"
          Description: "Allow all egress"
          IpProtocol: "-1"
        - 
          CidrIpv6: "::/0"
          Description: "Allow all egress"
          IpProtocol: "-1"
  CatalogAuroraMySqlComputeSecurityGroupInboundRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: "Allow traffic on MySql Port"
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref sgTask
      GroupId: !Sub '{{resolve:ssm:catalog-aurora-mysql-sg-${AWS::Region}${Env}}}'
  sgRedis:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Security group for Elasticache Redis"
      Tags: 
        - 
          Key: "environment-name"
          Value: "retail-store-ar"
        - 
          Key: "Name"
          Value: "retail-store-ar-checkout-redis"
        - 
          Key: "created-by"
          Value: "retail-store-sample-app"
        -
          Key: "service"
          Value: "checkout"
      VpcId: !Ref VpcId
      SecurityGroupIngress: 
        - 
          SourceSecurityGroupId: !Ref sgTask
          SourceSecurityGroupOwnerId: !Ref AWS::AccountId
          Description: "Selectively allow inbound traffic"
          FromPort: 6379
          IpProtocol: "tcp"
          ToPort: 6379
      SecurityGroupEgress: 
        - 
          CidrIp: "0.0.0.0/0"
          Description: "Allow all egress"
          IpProtocol: "-1"
        - 
          CidrIpv6: "::/0"
          Description: "Allow all egress"
          IpProtocol: "-1"
  
  #Secrets

  CWAgentConfSSM:
    Type: "AWS::SSM::Parameter"
    Properties:
      Name: !Sub 'CWAgentConf${Env}'
      Type: String
      Value: !Sub "{\"traces\": {\"traces_collected\": {\"xray\": {}, \"application_signals\": {}}},\"logs\": {\"metrics_collected\": {\"application_signals\": {}}}}"
      Description: "CW Agent Config"

  MqSecret:
    DependsOn: 
      - MqPassword 
    Type: "AWS::SecretsManager::Secret"
    Properties:
      Name: !Sub 'retail-store-ar-mq${Env}'
      KmsKeyId: !Ref KmsKey
      SecretString: !Sub "{\"host\":\"amqps://${OrdersMqBroker}.mq.${AWS::Region}.on.aws:5671\",\"password\":\"{{resolve:secretsmanager:retail-store-ar-mq-password${Env}}}\",\"username\":\"mq\"}"
      Tags:
        - Key: "service"
          Value: "orders"
  
  MqPassword:
    Type: "AWS::SecretsManager::Secret"
    Properties:
      Name: !Sub 'retail-store-ar-mq-password${Env}'
      KmsKeyId: !Ref KmsKey
      GenerateSecretString: 
        ExcludePunctuation: true
      Tags:
        - Key: "service"
          Value: "orders"

  LogGroupKey:
    Type: AWS::KMS::Key
    Properties:
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Id: key-loggroup
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Join
                - ''
                - - !Sub 'arn:${AWS::Partition}:iam::'
                  - !Ref 'AWS::AccountId'
                  - ':root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Enable Cloudwatch access
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: 
      RetentionInDays: 3
      KmsKeyId: !GetAtt LogGroupKey.Arn

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Tags:
        - Key: service
          Value: shared
      Scheme: internal
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: true
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value: !Sub '{{resolve:ssm:canaryBucketName${Env}}}'
        - Key: access_logs.s3.prefix
          Value: alb-access-logs
      SecurityGroups: 
        - !Ref sgAlb
      Subnets:
        - !Sub '{{resolve:ssm:Subnet1${Env}}}'
        - !Sub '{{resolve:ssm:Subnet2${Env}}}'
        - !Sub '{{resolve:ssm:Subnet3${Env}}}'
      Type: application
  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties: 
      Tags:
        - Key: service
          Value: ui
      TargetGroupAttributes:
      - 
        Key: load_balancing.algorithm.type
        Value: weighted_random
      -
        Key: load_balancing.algorithm.anomaly_mitigation
        Value: 'on'
      -
        Key: deregistration_delay.timeout_seconds
        Value: '5'
      HealthCheckEnabled: true
      HealthCheckPath: '/actuator'
      Port: 8080
      Protocol: HTTP
      Matcher:
        HttpCode: '200,302,303'
      TargetType: ip
      VpcId: !Ref VpcId
  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_2
            comment: "Internal ALB (Scheme: internal) with no public exposure. Canary health checks use HTTP. In production, configure ACM certificate and HTTPS listener."
          - id: CKV_AWS_103
            comment: "Internal ALB (Scheme: internal) with no public exposure. In production, configure TLS v1.2+ listener."
    Properties: 
      DefaultActions: 
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP

  EcsCluster:
    Type: AWS::ECS::Cluster
    # NGRH: intentionally NOT tagged "service" -- tagging the shared ECS cluster makes
    # every NGRH service discover ALL sibling ECS services on it via dependency
    # discovery (validated 2026-07-16). Left untagged so each service discovers only
    # its own ECS service. (The apps stack deploy intentionally passes no --tags.)
    Properties:
      ServiceConnectDefaults:
        Namespace: !Sub retail-store-ar${Env}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub mr-app-ecs-cluster${Env}
  
  #Carts Service
  CartsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: 
                - "ecs-tasks.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - !Ref FisTaskSsmManagedPolicy
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      Tags:
        - Key: "service"
          Value: "cart"
      Policies:
        - PolicyName: ecs 
          PolicyDocument: 
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/CWAgentConf${Env}'
                Action:
                  - "ssm:GetParameters"
                  - "ssm:DescribeParameters"
              - Effect: "Allow"
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                Action: 
                  - "logs:CreateLogStream"
                  - "logs:CreateLogGroup"
                  - "logs:DescribeLogStreams"
                  - "logs:PutRetentionPolicy"
                  - "logs:PutLogEvents"
              - Effect: "Allow"
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/{{resolve:secretsmanager:cartsTable${Env}Secret}}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/{{resolve:secretsmanager:cartsTable${Env}Secret}}/*'
                Action:
                  - "dynamodb:GetItem"
                  - "dynamodb:BatchGetItem"
                  - "dynamodb:Query"
                  - "dynamodb:PutItem"
                  - "dynamodb:UpdateItem"
                  - "dynamodb:DeleteItem"
                  - "dynamodb:BatchWriteItem"
  CartsTaskDefinition:
    Type:  AWS::ECS::TaskDefinition
    Properties:
      Volumes: 
        - Name:  opentelemetry-auto-instrumentation
      ExecutionRoleArn: !GetAtt CartsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt CartsTaskExecutionRole.Arn
      NetworkMode: awsvpc 
      # FIS ECS task actions: PidMode task lets the SSM agent sidecar reach the
      # application's processes, and EnableFaultInjection turns on the ECS
      # fault-injection endpoints that FIS network faults use on Fargate.
      PidMode: task
      EnableFaultInjection: true
      # 512 (was 256): on 256 units the JVM with the OpenTelemetry agent took
      # 132-238 s to start, too close to the 300-second cap on a health check's
      # start period, and AWS recommends 256 units for the Service Connect proxy
      # on top of the application's own.
      Cpu: 512
      # 1024 (was 512): room for the SSM agent sidecar. At 512 MB the containers
      # used about 400 MB, which left too little page cache: tasks kept re-reading
      # their files from disk and slowed down until requests timed out.
      Memory: 1024
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      Tags:
        - Key: "service"
          Value: "cart"
      ContainerDefinitions:
        # FIS fault-injection sidecar, as documented for aws:ecs:task-* actions:
        # it registers the task as an SSM managed instance tagged ECS_TASK_ARN,
        # which is how FIS finds the task. The image is this account's mirror
        # (mirror-sidecar-buildspec.yml) with the packages the start script and
        # the fault documents need baked in, because the task subnets have no
        # internet route. Non-essential: the application keeps serving if the
        # sidecar stops.
        - Name: amazon-ssm-agent
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/amazon-ssm-agent${Env}:latest'
          Cpu: 0
          Essential: false
          Command:
            - /bin/bash
            - -c
            - >-
              set -e; term_handler() { echo "Deleting SSM activation $ACTIVATION_ID"; if ! aws ssm delete-activation --activation-id $ACTIVATION_ID --region $ECS_TASK_REGION; then echo "SSM activation $ACTIVATION_ID failed to be deleted" 1>&2; fi; MANAGED_INSTANCE_ID=$(jq -e -r .ManagedInstanceID /var/lib/amazon/ssm/registration); echo "Deregistering SSM Managed Instance $MANAGED_INSTANCE_ID"; if ! aws ssm deregister-managed-instance --instance-id $MANAGED_INSTANCE_ID --region $ECS_TASK_REGION; then echo "SSM Managed Instance $MANAGED_INSTANCE_ID failed to be deregistered" 1>&2; fi; kill -SIGTERM $SSM_AGENT_PID; }; trap term_handler SIGTERM SIGINT; if [[ -z $MANAGED_INSTANCE_ROLE_NAME ]]; then echo "Environment variable MANAGED_INSTANCE_ROLE_NAME not set, exiting" 1>&2; exit 1; fi; if ! ps ax | grep amazon-ssm-agent | grep -v grep > /dev/null; then if [[ -n $ECS_CONTAINER_METADATA_URI_V4 ]] ; then echo "Found ECS Container Metadata, running activation with metadata"; TASK_METADATA=$(curl "${ECS_CONTAINER_METADATA_URI_V4}/task"); ECS_TASK_AVAILABILITY_ZONE=$(echo $TASK_METADATA | jq -e -r '.AvailabilityZone'); ECS_TASK_ARN=$(echo $TASK_METADATA | jq -e -r '.TaskARN'); ECS_TASK_REGION=$(echo $ECS_TASK_AVAILABILITY_ZONE | sed 's/.$//'); ECS_TASK_AVAILABILITY_ZONE_REGEX='^(af|ap|ca|cn|eu|me|sa|us|us-gov)-(central|north|(north(east|west))|south|south(east|west)|east|west)-[0-9]{1}[a-z]{1}$'; if ! [[ $ECS_TASK_AVAILABILITY_ZONE =~ $ECS_TASK_AVAILABILITY_ZONE_REGEX ]]; then echo "Error extracting Availability Zone from ECS Container Metadata, exiting" 1>&2; exit 1; fi; ECS_TASK_ARN_REGEX='^arn:(aws|aws-cn|aws-us-gov):ecs:[a-z0-9-]+:[0-9]{12}:task/[a-zA-Z0-9_-]+/[a-zA-Z0-9]+$'; if ! [[ $ECS_TASK_ARN =~ $ECS_TASK_ARN_REGEX ]]; then echo "Error extracting Task ARN from ECS Container Metadata, exiting" 1>&2; exit 1; fi; CREATE_ACTIVATION_OUTPUT=$(aws ssm create-activation --iam-role $MANAGED_INSTANCE_ROLE_NAME --tags Key=ECS_TASK_AVAILABILITY_ZONE,Value=$ECS_TASK_AVAILABILITY_ZONE Key=ECS_TASK_ARN,Value=$ECS_TASK_ARN Key=FAULT_INJECTION_SIDECAR,Value=true --region $ECS_TASK_REGION); ACTIVATION_CODE=$(echo $CREATE_ACTIVATION_OUTPUT | jq -e -r .ActivationCode); ACTIVATION_ID=$(echo $CREATE_ACTIVATION_OUTPUT | jq -e -r .ActivationId); if ! amazon-ssm-agent -register -code $ACTIVATION_CODE -id $ACTIVATION_ID -region $ECS_TASK_REGION; then echo "Failed to register with AWS Systems Manager (SSM), exiting" 1>&2; exit 1; fi; amazon-ssm-agent & SSM_AGENT_PID=$!; wait $SSM_AGENT_PID; else echo "ECS Container Metadata not found, exiting" 1>&2; exit 1; fi; else echo "SSM agent is already running, exiting" 1>&2; exit 1; fi
          Environment:
            - Name: MANAGED_INSTANCE_ROLE_NAME
              Value: !Ref FisSsmManagedInstanceRole
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs
        # Keeps carts serving through the start of a stop. Callers' Service
        # Connect proxies can still send a stopping task requests for a few
        # seconds after its application gets the stop signal (up to ~5 s in
        # test2), and the task's own proxy answers those requests with 503 once
        # the application has exited. A container dependency reverses at
        # shutdown: ECS stops a container only after every container that
        # depends on it has stopped. So carts gets its stop signal only after
        # this container exits, SHUTDOWN_DELAY_SECONDS after ECS signals it
        # (15 s, three times the longest window seen). In test2 the application
        # got its signal ~26 s later than before: ECS took another ~11 s to move
        # on to it. It reuses the FIS sidecar's image, which every task already
        # pulls, because it needs only bash and sleep.
        - Name: shutdown-delay
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/amazon-ssm-agent${Env}:latest'
          Cpu: 0
          Essential: false
          DependsOn:
            - ContainerName: carts
              Condition: START
          # Must exceed SHUTDOWN_DELAY_SECONDS, or ECS kills the delay early.
          StopTimeout: 30
          Environment:
            - Name: SHUTDOWN_DELAY_SECONDS
              Value: "15"
          Command:
            - /bin/bash
            - -c
            - >-
              if ! [[ $SHUTDOWN_DELAY_SECONDS =~ ^[0-9]+$ ]]; then echo "SHUTDOWN_DELAY_SECONDS must be a whole number of seconds" 1>&2; exit 1; fi; release() { echo "Stop requested: holding the application for $SHUTDOWN_DELAY_SECONDS seconds"; sleep "$SHUTDOWN_DELAY_SECONDS"; kill "$SLEEPER_PID" 2>/dev/null; echo "Releasing the application"; exit 0; }; trap release SIGTERM SIGINT; sleep infinity & SLEEPER_PID=$!; wait "$SLEEPER_PID"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs
        -
          Name: "carts"
          # The START dependency on the CloudWatch agent also reverses at
          # shutdown, so the agent outlives carts and its traces and metrics
          # cover the shutdown delay.
          DependsOn:
            - ContainerName: init
              Condition: SUCCESS
            - ContainerName: ecs-cwagent
              Condition: START
          MountPoints: 
            - SourceVolume: opentelemetry-auto-instrumentation
              ContainerPath: /otel-auto-instrumentation
              ReadOnly: false
          PortMappings:
            - ContainerPort: 8080
              Name: carts
              AppProtocol: http
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/carts${Env}:${Tag}"
          Cpu: 0
          MemoryReservation: 50
          Essential: true
          # During a deployment ECS stops the old tasks only after new ones pass
          # this check, and it replaces a task that stops answering it. The
          # readiness group checks no dependencies, so a DynamoDB problem never
          # makes ECS replace tasks. MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          # below creates the endpoint; without it the check gets a 404.
          HealthCheck:
            Command:
              - CMD
              - wget
              - -q
              - -O
              - /dev/null
              - http://localhost:8080/actuator/health/readiness
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 240
          Environment:
            - Name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              Value: "true"
            - Name: CARTS_DYNAMODB_TABLENAME
              Value: !Sub '{{resolve:secretsmanager:cartsTable${Env}Secret}}'
            - Name: SPRING_PROFILES_ACTIVE
              Value: dynamodb
            - Name: OTEL_RESOURCE_ATTRIBUTES
              Value: !Sub "service.name=carts${Env},service.namespace=retail-store-ar,aws.log.group.names=${LogGroup}"
            - Name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED
              Value: true
            - Name: OTEL_EXPORTER_OTLP_PROTOCOL
              Value: http/protobuf
            - Name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT
              Value: http://localhost:4316/v1/metrics
            - Name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              Value: http://localhost:4316/v1/traces
            - Name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              Value: http://localhost:4316/v1/metrics
            - Name: OTEL_TRACES_SAMPLER
              Value: xray
            - Name: OTEL_PROPAGATORS
              Value: "tracecontext,baggage,b3,xray"
            - Name: JAVA_TOOL_OPTIONS
              Value: " -javaagent:/otel-auto-instrumentation/javaagent.jar"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs  
        -
          Name: ecs-cwagent
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cloudwatch-agent${Env}:latest'
          Essential: true
          Secrets: 
            - Name: CW_CONFIG_CONTENT
              ValueFrom: !Ref CWAgentConfSSM
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/ecs-cwagent
              awslogs-create-group: true
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: ecs
        -
          Name: init
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/adot-autoinstrumentation-java${Env}:v2.29.0'
          Essential: false
          MountPoints: 
            - SourceVolume: opentelemetry-auto-instrumentation
              ContainerPath: /otel-auto-instrumentation
              ReadOnly: false
          Command: 
            - cp
            - /javaagent.jar
            - /otel-auto-instrumentation/javaagent.jar

